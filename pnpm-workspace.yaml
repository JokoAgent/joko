packages:
  - apps/*
  - packages/*

# Keep native Windows builds below Ninja's legacy path ceiling. The virtual
# package path is repeated in CMake object paths, so both the store location
# and individual directory names must remain short.
virtualStoreDir: .pnpm
virtualStoreDirMaxLength: 32

# Development packages are built from the remote branch in linkspan.json.
overrides:
  # Fix custom logger redaction for nested sensitive data (aws/aws-sdk-js-v3#8393).
  '@smithy/core': 3.38.1
  # Use the SDK 57 fix for Swift 6.2 constructor ownership and actor isolation (expo/expo#51040).
  expo-modules-jsi: 57.1.2
  '@jokoagent/linkspan-core': file:.runtime/linkspan-packages/core
  '@jokoagent/linkspan-noise': file:.runtime/linkspan-packages/noise
  '@jokoagent/linkspan-http': file:.runtime/linkspan-packages/http
  '@jokoagent/linkspan-http-connect': file:.runtime/linkspan-packages/http-connect
  '@jokoagent/linkspan-cloudflare': file:.runtime/linkspan-packages/cloudflare
  '@jokoagent/linkspan-connectors': file:.runtime/linkspan-packages/connectors
  '@jokoagent/linkspan-connector-runtime': file:.runtime/linkspan-packages/connector-runtime
  '@jokoagent/linkspan-ngrok': file:.runtime/linkspan-packages/ngrok
  '@jokoagent/linkspan-ssh': file:.runtime/linkspan-packages/ssh
  '@jokoagent/linkspan-pinggy': file:.runtime/linkspan-packages/pinggy
  '@jokoagent/linkspan-dev-tunnels': file:.runtime/linkspan-packages/dev-tunnels
  '@jokoagent/linkspan-localtunnel': file:.runtime/linkspan-packages/localtunnel
  '@jokoagent/linkspan-iroh': file:.runtime/linkspan-packages/iroh
  '@jokoagent/linkspan-iroh-node': file:.runtime/linkspan-packages/iroh-node
  '@jokoagent/linkspan-iroh-wasm': file:.runtime/linkspan-packages/iroh-wasm
  '@jokoagent/linkspan-iroh-services': file:.runtime/linkspan-packages/iroh-services
  '@jokoagent/linkspan-tailcat': file:.runtime/linkspan-packages/tailcat
  '@jokoagent/linkspan-tailcat-node': file:.runtime/linkspan-packages/tailcat-node
  '@jokoagent/linkspan-tailcat-wasm': file:.runtime/linkspan-packages/tailcat-wasm
  '@jokoagent/linkspan-tailcat-runtime': file:.runtime/linkspan-packages/tailcat-runtime
  '@jokoagent/linkspan-turn': file:.runtime/linkspan-packages/turn
  '@jokoagent/linkspan-webrtc': file:.runtime/linkspan-packages/webrtc
  '@jokoagent/linkspan-webrtc-node': file:.runtime/linkspan-packages/webrtc-node

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@earendil-works/*'
  - '@joko/*'
  # Apply the upstream redaction fix without waiting seven days.
  - '@smithy/core@3.38.1'
  # Integrity-audited decoder fixes valid HEVC conformance-window and crop failures in 1.23.2.
  - 'libheif-js@1.23.5'
  # Audited SDK release paired with native CLI 2.1.280.
  - '@anthropic-ai/claude-agent-sdk@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.280'

patchedDependencies:
  '@modelcontextprotocol/ext-apps@1.7.5': dependency-patches/@modelcontextprotocol-ext-apps@1.7.5.patch
  expo-image-manipulator@57.0.14: dependency-patches/expo-image-manipulator@57.0.14.patch
  expo-image@57.0.3: dependency-patches/expo-image@57.0.3.patch
  node-pty@1.1.0: dependency-patches/node-pty@1.1.0.patch
  ssh2@1.17.0: dependency-patches/ssh2@1.17.0.patch

allowBuilds:
  '@bufbuild/buf': true
  '@earendil-works/pi-coding-agent': true
  '@google/genai': false
  better-sqlite3: true
  electron: true
  # Squirrel is a transitive electron-builder peer, but Joko emits NSIS/ZIP.
  # Its install hook only selects a vendored 7-Zip binary and is not needed.
  electron-winstaller: false
  esbuild: true
  protobufjs: false
  sharp: true
  node-pty: true
  # The transport has a complete pure-JavaScript fallback. Do not run optional native probes.
  cpu-features: false
  ssh2: false
  '@pinggy/pinggy': false
  bufferutil: false
  es5-ext: false
  utf-8-validate: false
