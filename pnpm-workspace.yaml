packages:
  - apps/*
  - packages/*

# Keep native Windows builds below Ninja's legacy path ceiling. The virtual
# package path is repeated in CMake object paths, so both the store location
# and individual directory names must remain short.
virtualStoreDir: .pnpm
virtualStoreDirMaxLength: 32

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@earendil-works/*'
  - '@joko/*'
  # Audited SDK release paired with native CLI 2.1.259.
  - '@anthropic-ai/claude-agent-sdk@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.259'

patchedDependencies:
  expo-image-manipulator@57.0.14: dependency-patches/expo-image-manipulator@57.0.14.patch

allowBuilds:
  '@bufbuild/buf': true
  '@earendil-works/pi-coding-agent': true
  '@google/genai': false
  better-sqlite3: true
  electron: true
  # Squirrel is a transitive electron-builder peer, but Joko emits NSIS/ZIP.
  # Its install hook only selects a vendored 7-Zip binary and is not needed.
  electron-winstaller: false
  esbuild: true
  protobufjs: false
  sharp: true
  node-pty: true
  # The transport has a complete pure-JavaScript fallback. Do not run optional native probes.
  cpu-features: false
  ssh2: false
