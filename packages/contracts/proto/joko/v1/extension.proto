syntax = "proto3";

package joko.v1;

import "google/protobuf/timestamp.proto";
import "joko/v1/common.proto";
import "joko/v1/settings.proto";

enum ExtensionCatalogSource {
  EXTENSION_CATALOG_SOURCE_UNSPECIFIED = 0;
  EXTENSION_CATALOG_SOURCE_LOCAL = 1;
  EXTENSION_CATALOG_SOURCE_MARKET = 2;
}

enum ExtensionInstallState {
  EXTENSION_INSTALL_STATE_UNSPECIFIED = 0;
  EXTENSION_INSTALL_STATE_AVAILABLE = 1;
  EXTENSION_INSTALL_STATE_INSTALLING = 2;
  EXTENSION_INSTALL_STATE_INSTALLED = 3;
  EXTENSION_INSTALL_STATE_UPDATE_AVAILABLE = 4;
  EXTENSION_INSTALL_STATE_ERROR = 5;
}

enum ExtensionSetupState {
  EXTENSION_SETUP_STATE_UNSPECIFIED = 0;
  EXTENSION_SETUP_STATE_NOT_REQUIRED = 1;
  EXTENSION_SETUP_STATE_REQUIRED = 2;
  EXTENSION_SETUP_STATE_IN_PROGRESS = 3;
  EXTENSION_SETUP_STATE_READY = 4;
  EXTENSION_SETUP_STATE_CANCELLED = 5;
  EXTENSION_SETUP_STATE_FAILED = 6;
}

enum ExtensionSetupFieldKind {
  EXTENSION_SETUP_FIELD_KIND_UNSPECIFIED = 0;
  EXTENSION_SETUP_FIELD_KIND_TEXT = 1;
  EXTENSION_SETUP_FIELD_KIND_SECRET = 2;
  EXTENSION_SETUP_FIELD_KIND_OAUTH = 3;
  EXTENSION_SETUP_FIELD_KIND_CONFIRMATION = 4;
}

enum ExtensionSourceKind {
  EXTENSION_SOURCE_KIND_UNSPECIFIED = 0;
  EXTENSION_SOURCE_KIND_LOCAL = 1;
  EXTENSION_SOURCE_KIND_GIT = 2;
}

enum ExtensionSourceState {
  EXTENSION_SOURCE_STATE_UNSPECIFIED = 0;
  EXTENSION_SOURCE_STATE_READY = 1;
  EXTENSION_SOURCE_STATE_ERROR = 2;
}

enum ExtensionPackageAction {
  EXTENSION_PACKAGE_ACTION_UNSPECIFIED = 0;
  EXTENSION_PACKAGE_ACTION_INSTALL = 1;
  EXTENSION_PACKAGE_ACTION_UPDATE = 2;
  EXTENSION_PACKAGE_ACTION_REPLACE = 3;
}

message ExtensionLocalSource {
  string path = 1;
}

message ExtensionGitSource {
  string repository_url = 1;
  optional string ref = 2;
  repeated string sparse_paths = 3;
}

message ExtensionSourceLocation {
  oneof kind {
    ExtensionLocalSource local = 1;
    ExtensionGitSource git = 2;
  }
}

message ExtensionResourceOwner {
  string resource_id = 1;
  string discovered_revision = 2;
  Revision resource_version = 3;
}

message ExtensionMcpOwner {
  string mcp_server_id = 1;
  Revision server_revision = 2;
}

message ExtensionSourceOwner {
  string source_id = 1;
  Revision source_revision = 2;
  string entry_id = 3;
  string content_revision = 4;
}

message ExtensionOwner {
  oneof kind {
    ExtensionResourceOwner resource = 1;
    ExtensionMcpOwner mcp = 2;
    ExtensionSourceOwner source = 3;
  }
}

message ExtensionSourceDescriptor {
  string source_id = 1;
  Revision revision = 2;
  ExtensionSourceKind kind = 3;
  ExtensionSourceLocation location = 4;
  string name = 5;
  optional string display_name = 6;
  ExtensionSourceState state = 7;
  string content_revision = 8;
  uint32 discovered_extension_count = 9;
  uint32 declared_entry_count = 10;
  uint32 skipped_entry_count = 11;
  uint32 unreadable_entry_count = 12;
  google.protobuf.Timestamp added_at = 13;
  optional google.protobuf.Timestamp refreshed_at = 14;
  optional string error = 15;
}

message ExtensionSourceGitPreflight {
  bool available = 1;
  optional string version = 2;
  string minimum_version = 3;
}

message ExtensionToolDescriptor {
  string name = 1;
  string description = 2;
  bool requires_permission = 3;
}

message ExtensionPermissionDescriptor {
  string permission_id = 1;
  string label = 2;
  string description = 3;
  bool required = 4;
  bool granted = 5;
}

message ExtensionCommandDescriptor {
  string name = 1;
  string description = 2;
  string session_id = 3;
}

message ExtensionSetupFieldDescriptor {
  string field_id = 1;
  string label = 2;
  string description = 3;
  ExtensionSetupFieldKind kind = 4;
  bool required = 5;
  bool configured = 6;
  repeated string options = 7;
}

message ExtensionSetupDescriptor {
  ExtensionSetupState state = 1;
  optional string attempt_id = 2;
  Revision revision = 3;
  repeated ExtensionSetupFieldDescriptor fields = 4;
  optional string error = 5;
}

message ExtensionPackageUpdate {
  ExtensionSourceOwner source = 1;
  optional string available_version = 2;
  bool source_replacement = 3;
}

message ExtensionPackageCurrentResource {
  string resource_id = 1;
  Revision resource_revision = 2;
  string name = 3;
  string source_display = 4;
}

message ExtensionPackagePreview {
  string extension_id = 1;
  Revision extension_revision = 2;
  ExtensionPackageAction action = 3;
  string resource_id = 4;
  string backend_id = 5;
  string package_name = 6;
  optional string installed_version = 7;
  optional string available_version = 8;
  optional ExtensionPackageCurrentResource current_resource = 9;
  bool source_replacement = 10;
  bool preserves_enabled = 11;
  repeated ResourceCompatibilityDetail compatibility_details = 12;
  repeated ResourceRuntimeRequirement runtime_requirements = 13;
  repeated ResourcePackageWarning warnings = 14;
  repeated string disabled_lifecycle_scripts = 15;
  bool can_toggle = 16;
}

// Generic Extension projection. Executable bytes and secrets are deliberately
// absent: owner carries only exact Resource/MCP references and setup carries
// protected credential readiness.
message ExtensionCatalogEntry {
  string extension_id = 1;
  Revision revision = 2;
  ExtensionOwner owner = 3;
  ExtensionCatalogSource source = 4;
  bool installed = 5;
  ExtensionInstallState install_state = 6;
  string name = 7;
  optional string version = 8;
  optional string author = 9;
  string description = 10;
  bool enabled = 11;
  bool sidebar_supported = 12;
  bool sidebar_visible = 13;
  repeated ExtensionToolDescriptor tools = 14;
  repeated ExtensionPermissionDescriptor permissions = 15;
  repeated ExtensionCommandDescriptor commands = 16;
  ExtensionSetupDescriptor setup = 17;
  bool use_supported = 18;
  optional string error = 19;
  optional ExtensionPackageUpdate update = 20;
}

message ExtensionCatalogSnapshot {
  Revision revision = 1;
  repeated ExtensionCatalogEntry entries = 2;
  bool recovered_from_corruption = 3;
}
