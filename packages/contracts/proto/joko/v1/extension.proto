syntax = "proto3";

package joko.v1;

import "google/protobuf/timestamp.proto";
import "joko/v1/common.proto";
import "joko/v1/settings.proto";

enum ExtensionCatalogSource {
  EXTENSION_CATALOG_SOURCE_UNSPECIFIED = 0;
  EXTENSION_CATALOG_SOURCE_LOCAL = 1;
  EXTENSION_CATALOG_SOURCE_MARKET = 2;
}

enum ExtensionInstallState {
  EXTENSION_INSTALL_STATE_UNSPECIFIED = 0;
  EXTENSION_INSTALL_STATE_AVAILABLE = 1;
  EXTENSION_INSTALL_STATE_INSTALLING = 2;
  EXTENSION_INSTALL_STATE_INSTALLED = 3;
  EXTENSION_INSTALL_STATE_UPDATE_AVAILABLE = 4;
  EXTENSION_INSTALL_STATE_ERROR = 5;
}

enum ExtensionSetupState {
  EXTENSION_SETUP_STATE_UNSPECIFIED = 0;
  EXTENSION_SETUP_STATE_NOT_REQUIRED = 1;
  EXTENSION_SETUP_STATE_REQUIRED = 2;
  EXTENSION_SETUP_STATE_IN_PROGRESS = 3;
  EXTENSION_SETUP_STATE_READY = 4;
  EXTENSION_SETUP_STATE_CANCELLED = 5;
  EXTENSION_SETUP_STATE_FAILED = 6;
}

enum ExtensionSetupFieldKind {
  EXTENSION_SETUP_FIELD_KIND_UNSPECIFIED = 0;
  EXTENSION_SETUP_FIELD_KIND_TEXT = 1;
  EXTENSION_SETUP_FIELD_KIND_SECRET = 2;
  EXTENSION_SETUP_FIELD_KIND_OAUTH = 3;
  EXTENSION_SETUP_FIELD_KIND_CONFIRMATION = 4;
}

enum ExtensionSourceKind {
  EXTENSION_SOURCE_KIND_UNSPECIFIED = 0;
  EXTENSION_SOURCE_KIND_LOCAL = 1;
  EXTENSION_SOURCE_KIND_GIT = 2;
}

enum ExtensionSourceState {
  EXTENSION_SOURCE_STATE_UNSPECIFIED = 0;
  EXTENSION_SOURCE_STATE_READY = 1;
  EXTENSION_SOURCE_STATE_ERROR = 2;
}

enum ExtensionPackageAction {
  EXTENSION_PACKAGE_ACTION_UNSPECIFIED = 0;
  EXTENSION_PACKAGE_ACTION_INSTALL = 1;
  EXTENSION_PACKAGE_ACTION_UPDATE = 2;
  EXTENSION_PACKAGE_ACTION_REPLACE = 3;
}

enum ExtensionPackageExportState {
  EXTENSION_PACKAGE_EXPORT_STATE_UNSPECIFIED = 0;
  EXTENSION_PACKAGE_EXPORT_STATE_PENDING = 1;
  EXTENSION_PACKAGE_EXPORT_STATE_SNAPSHOTTING = 2;
  EXTENSION_PACKAGE_EXPORT_STATE_PACKAGING = 3;
  EXTENSION_PACKAGE_EXPORT_STATE_VERIFYING = 4;
  EXTENSION_PACKAGE_EXPORT_STATE_READY = 5;
  EXTENSION_PACKAGE_EXPORT_STATE_FAILED = 6;
  EXTENSION_PACKAGE_EXPORT_STATE_CANCELLED = 7;
}

enum ExtensionMainViewIcon {
  EXTENSION_MAIN_VIEW_ICON_UNSPECIFIED = 0;
  EXTENSION_MAIN_VIEW_ICON_ACTIVITY = 1;
  EXTENSION_MAIN_VIEW_ICON_BOX = 2;
  EXTENSION_MAIN_VIEW_ICON_CODE = 3;
  EXTENSION_MAIN_VIEW_ICON_FILE_TEXT = 4;
  EXTENSION_MAIN_VIEW_ICON_GLOBE = 5;
  EXTENSION_MAIN_VIEW_ICON_LAYOUT = 6;
  EXTENSION_MAIN_VIEW_ICON_SEARCH = 7;
  EXTENSION_MAIN_VIEW_ICON_SPARKLES = 8;
  EXTENSION_MAIN_VIEW_ICON_TERMINAL = 9;
  EXTENSION_MAIN_VIEW_ICON_TOOL = 10;
}

enum ExtensionLibraryState {
  EXTENSION_LIBRARY_STATE_UNSPECIFIED = 0;
  EXTENSION_LIBRARY_STATE_READY = 1;
  EXTENSION_LIBRARY_STATE_READ_ONLY = 2;
  EXTENSION_LIBRARY_STATE_UNAVAILABLE = 3;
}

enum ExtensionLibraryUnavailableReason {
  EXTENSION_LIBRARY_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  EXTENSION_LIBRARY_UNAVAILABLE_REASON_METADATA_CORRUPT = 1;
  EXTENSION_LIBRARY_UNAVAILABLE_REASON_FILE_LIMIT = 2;
  EXTENSION_LIBRARY_UNAVAILABLE_REASON_IO = 3;
  EXTENSION_LIBRARY_UNAVAILABLE_REASON_OPERATION_IN_PROGRESS = 4;
  EXTENSION_LIBRARY_UNAVAILABLE_REASON_DISK_MISSING = 5;
  EXTENSION_LIBRARY_UNAVAILABLE_REASON_BINDING_MOVED = 6;
  EXTENSION_LIBRARY_UNAVAILABLE_REASON_STATE_CORRUPT = 7;
}

enum ExtensionLibraryLocationKind {
  EXTENSION_LIBRARY_LOCATION_KIND_UNSPECIFIED = 0;
  EXTENSION_LIBRARY_LOCATION_KIND_DEFAULT = 1;
  EXTENSION_LIBRARY_LOCATION_KIND_CUSTOM = 2;
}

enum ExtensionLibraryEntryKind {
  EXTENSION_LIBRARY_ENTRY_KIND_UNSPECIFIED = 0;
  EXTENSION_LIBRARY_ENTRY_KIND_FILE = 1;
  EXTENSION_LIBRARY_ENTRY_KIND_DIRECTORY = 2;
}

message ExtensionLocalSource {
  string path = 1;
}

message ExtensionGitSource {
  string repository_url = 1;
  optional string ref = 2;
  repeated string sparse_paths = 3;
}

message ExtensionSourceLocation {
  oneof kind {
    ExtensionLocalSource local = 1;
    ExtensionGitSource git = 2;
  }
}

message ExtensionResourceOwner {
  string resource_id = 1;
  string discovered_revision = 2;
  Revision resource_version = 3;
}

message ExtensionMcpOwner {
  string mcp_server_id = 1;
  Revision server_revision = 2;
}

message ExtensionSourceOwner {
  string source_id = 1;
  Revision source_revision = 2;
  string entry_id = 3;
  string content_revision = 4;
}

message ExtensionOwner {
  oneof kind {
    ExtensionResourceOwner resource = 1;
    ExtensionMcpOwner mcp = 2;
    ExtensionSourceOwner source = 3;
  }
}

message ExtensionSourceDescriptor {
  string source_id = 1;
  Revision revision = 2;
  ExtensionSourceKind kind = 3;
  ExtensionSourceLocation location = 4;
  string name = 5;
  optional string display_name = 6;
  ExtensionSourceState state = 7;
  string content_revision = 8;
  uint32 discovered_extension_count = 9;
  uint32 declared_entry_count = 10;
  uint32 skipped_entry_count = 11;
  uint32 unreadable_entry_count = 12;
  google.protobuf.Timestamp added_at = 13;
  optional google.protobuf.Timestamp refreshed_at = 14;
  optional string error = 15;
}

message ExtensionSourceGitPreflight {
  bool available = 1;
  optional string version = 2;
  string minimum_version = 3;
}

message ExtensionToolDescriptor {
  string name = 1;
  string description = 2;
  bool requires_permission = 3;
}

message ExtensionPermissionDescriptor {
  string permission_id = 1;
  string label = 2;
  string description = 3;
  bool required = 4;
  bool granted = 5;
}

message ExtensionCommandDescriptor {
  string name = 1;
  string description = 2;
  string session_id = 3;
}

message ExtensionSetupFieldDescriptor {
  string field_id = 1;
  string label = 2;
  string description = 3;
  ExtensionSetupFieldKind kind = 4;
  bool required = 5;
  bool configured = 6;
  repeated string options = 7;
}

message ExtensionSetupDescriptor {
  ExtensionSetupState state = 1;
  optional string attempt_id = 2;
  Revision revision = 3;
  repeated ExtensionSetupFieldDescriptor fields = 4;
  optional string error = 5;
}

message ExtensionPackageUpdate {
  ExtensionSourceOwner source = 1;
  optional string available_version = 2;
  bool source_replacement = 3;
}

message ExtensionPackageCurrentResource {
  string resource_id = 1;
  Revision resource_revision = 2;
  string name = 3;
  string source_display = 4;
}

message ExtensionPackagePreview {
  string extension_id = 1;
  Revision extension_revision = 2;
  ExtensionPackageAction action = 3;
  string resource_id = 4;
  string backend_id = 5;
  string package_name = 6;
  optional string installed_version = 7;
  optional string available_version = 8;
  optional ExtensionPackageCurrentResource current_resource = 9;
  bool source_replacement = 10;
  bool preserves_enabled = 11;
  repeated ResourceCompatibilityDetail compatibility_details = 12;
  repeated ResourceRuntimeRequirement runtime_requirements = 13;
  repeated ResourcePackageWarning warnings = 14;
  repeated string disabled_lifecycle_scripts = 15;
  bool can_toggle = 16;
}

message ExtensionPackageExportAuthority {
  string extension_id = 1;
  Revision extension_revision = 2;
  string resource_id = 3;
  Revision resource_revision = 4;
  string discovered_revision = 5;
  string backend_id = 6;
  Revision backend_revision = 7;
  uint64 backend_generation = 8;
  string package_name = 9;
  optional string package_version = 10;
}

message ExtensionPackageExportJob {
  string export_id = 1;
  Revision revision = 2;
  ExtensionPackageExportState state = 3;
  ExtensionPackageExportAuthority authority = 4;
  string archive_format = 5;
  string file_name = 6;
  uint32 files = 7;
  uint64 uncompressed_bytes = 8;
  optional BlobRef artifact = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  optional google.protobuf.Timestamp completed_at = 12;
  optional string error = 13;
}

message ExtensionPackageExportPreview {
  ExtensionPackageExportAuthority authority = 1;
  string archive_format = 2;
  string file_name = 3;
  uint32 maximum_entries = 4;
  uint64 maximum_uncompressed_bytes = 5;
  bool local_only = 6;
  optional ExtensionPackageExportJob active_export = 7;
}

message ExtensionMainViewDescriptor {
  optional string title = 1;
  ExtensionMainViewIcon icon = 2;
}

message ExtensionLibraryDescriptor {
  uint32 schema_version = 1;
}

message ExtensionLibraryLimits {
  uint64 maximum_read_bytes = 1;
  uint64 maximum_write_bytes = 2;
  uint64 maximum_stream_bytes = 3;
  uint32 maximum_path_characters = 4;
  uint32 maximum_path_segments = 5;
  uint32 maximum_list_page_size = 6;
  uint32 maximum_files = 7;
  uint64 soft_limit_bytes = 8;
  uint64 disk_reserve_bytes = 9;
}

message ExtensionLibraryLocation {
  ExtensionLibraryLocationKind kind = 1;
  string path = 2;
  Revision generation = 3;
}

message ExtensionLibraryOperationStatus {
  string operation_id = 1;
  string phase = 2;
}

message ExtensionLibraryOverview {
  string extension_id = 1;
  string name = 2;
  ExtensionLibraryState state = 3;
  ExtensionLibraryUnavailableReason unavailable_reason = 4;
  optional ExtensionLibraryLocation location = 5;
  uint32 files = 6;
  uint64 bytes = 7;
  optional uint64 disk_free_bytes = 8;
  uint64 soft_limit_bytes = 9;
  bool soft_limit_exceeded = 10;
  bool orphaned = 11;
  uint32 trash_count = 12;
  uint32 grace_count = 13;
  optional ExtensionLibraryOperationStatus operation = 14;
}

message ExtensionLibraryLocationValidation {
  string library_root = 1;
  repeated string warnings = 2;
  optional uint64 disk_free_bytes = 3;
}

message ExtensionLibrarySession {
  string session_id = 1;
  string extension_id = 2;
  google.protobuf.Timestamp expires_at = 3;
  Revision binding_generation = 4;
  ExtensionLibraryLimits limits = 5;
}

message ExtensionLibraryEntry {
  string path = 1;
  ExtensionLibraryEntryKind kind = 2;
  uint64 bytes = 3;
  google.protobuf.Timestamp modified_at = 4;
}

message ExtensionLibraryReadOperation {
  string path = 1;
  optional uint64 offset = 2;
  optional uint64 length = 3;
}

message ExtensionLibraryWriteOperation {
  string path = 1;
  bytes content = 2;
  bool if_not_exists = 3;
}

message ExtensionLibraryStatOperation {
  string path = 1;
}

message ExtensionLibraryListOperation {
  optional string path = 1;
  bool recursive = 2;
  optional uint32 limit = 3;
  optional string cursor = 4;
}

message ExtensionLibraryMkdirOperation {
  string path = 1;
}

message ExtensionLibraryDeleteOperation {
  string path = 1;
  bool recursive = 2;
}

message ExtensionLibraryRenameOperation {
  string from = 1;
  string to = 2;
  bool overwrite = 3;
}

message ExtensionLibraryWriteBeginOperation {
  string path = 1;
  uint64 total_bytes = 2;
  optional string sha256 = 3;
  bool if_not_exists = 4;
}

message ExtensionLibraryWriteChunkOperation {
  string stream_id = 1;
  uint32 sequence = 2;
  bytes content = 3;
}

message ExtensionLibraryWriteCommitOperation {
  string stream_id = 1;
}

message ExtensionLibraryWriteAbortOperation {
  string stream_id = 1;
}

message ExtensionLibrarySqlValue {
  oneof value {
    bool null_value = 1;
    double number_value = 2;
    string integer_value = 3;
    string text_value = 4;
    bytes blob_value = 5;
  }
}

message ExtensionLibrarySqlCell {
  string name = 1;
  ExtensionLibrarySqlValue value = 2;
}

message ExtensionLibrarySqlRow {
  repeated ExtensionLibrarySqlCell cells = 1;
}

message ExtensionLibrarySqlStatement {
  string sql = 1;
  repeated ExtensionLibrarySqlValue parameters = 2;
}

message ExtensionLibrarySqlOpenOperation {
  string path = 1;
  bool create = 2;
  bool read_only = 3;
}

message ExtensionLibrarySqlExecuteOperation {
  string handle_id = 1;
  ExtensionLibrarySqlStatement statement = 2;
}

message ExtensionLibrarySqlBatchOperation {
  string handle_id = 1;
  repeated ExtensionLibrarySqlStatement statements = 2;
}

message ExtensionLibrarySqlMigration {
  uint32 version = 1;
  repeated string statements = 2;
}

message ExtensionLibrarySqlMigrateOperation {
  string handle_id = 1;
  repeated ExtensionLibrarySqlMigration migrations = 2;
}

message ExtensionLibrarySqlBackupOperation {
  string handle_id = 1;
  string target_path = 2;
}

message ExtensionLibrarySqlHandleOperation {
  string handle_id = 1;
}

message ExtensionLibraryCall {
  oneof operation {
    ExtensionLibraryReadOperation read = 1;
    ExtensionLibraryWriteOperation write = 2;
    ExtensionLibraryStatOperation stat = 3;
    ExtensionLibraryListOperation list = 4;
    ExtensionLibraryMkdirOperation mkdir = 5;
    ExtensionLibraryDeleteOperation delete = 6;
    ExtensionLibraryRenameOperation rename = 7;
    ExtensionLibraryWriteBeginOperation write_begin = 8;
    ExtensionLibraryWriteChunkOperation write_chunk = 9;
    ExtensionLibraryWriteCommitOperation write_commit = 10;
    ExtensionLibraryWriteAbortOperation write_abort = 11;
    ExtensionLibrarySqlOpenOperation sql_open = 12;
    ExtensionLibrarySqlExecuteOperation sql_execute = 13;
    ExtensionLibrarySqlBatchOperation sql_batch = 14;
    ExtensionLibrarySqlMigrateOperation sql_migrate = 15;
    ExtensionLibrarySqlBackupOperation sql_backup = 16;
    ExtensionLibrarySqlHandleOperation sql_check = 17;
    ExtensionLibrarySqlHandleOperation sql_close = 18;
  }
}

message ExtensionLibraryReadResult {
  string path = 1;
  bytes content = 2;
  string sha256 = 3;
}

message ExtensionLibraryWriteResult {
  string path = 1;
  uint64 bytes = 2;
  string sha256 = 3;
}

message ExtensionLibraryListResult {
  repeated ExtensionLibraryEntry entries = 1;
  optional string next_cursor = 2;
}

message ExtensionLibraryPathResult {
  string path = 1;
  bool existed = 2;
}

message ExtensionLibraryRenameResult {
  string from = 1;
  string to = 2;
}

message ExtensionLibraryStreamResult {
  string stream_id = 1;
  uint64 received_bytes = 2;
  uint32 next_sequence = 3;
  optional google.protobuf.Timestamp expires_at = 4;
  bool aborted = 5;
}

message ExtensionLibrarySqlHandle {
  string handle_id = 1;
  string path = 2;
  bool read_only = 3;
  uint32 user_version = 4;
}

message ExtensionLibrarySqlResult {
  repeated ExtensionLibrarySqlRow rows = 1;
  string changes = 2;
  optional string last_insert_row_id = 3;
}

message ExtensionLibrarySqlBatchResult {
  repeated ExtensionLibrarySqlResult results = 1;
}

message ExtensionLibrarySqlVersionResult {
  uint32 user_version = 1;
  optional string path = 2;
}

message ExtensionLibraryBooleanResult {
  bool value = 1;
}

message ExtensionLibraryCallResult {
  oneof result {
    ExtensionLibraryReadResult read = 1;
    ExtensionLibraryWriteResult write = 2;
    ExtensionLibraryEntry stat = 3;
    ExtensionLibraryListResult list = 4;
    ExtensionLibraryPathResult path = 5;
    ExtensionLibraryRenameResult rename = 6;
    ExtensionLibraryStreamResult stream = 7;
    ExtensionLibrarySqlHandle sql_handle = 8;
    ExtensionLibrarySqlResult sql_result = 9;
    ExtensionLibrarySqlBatchResult sql_batch = 10;
    ExtensionLibrarySqlVersionResult sql_version = 11;
    ExtensionLibraryBooleanResult boolean = 12;
  }
}

message ExtensionLibraryTrashEntry {
  string trash_id = 1;
  string extension_id = 2;
  string name = 3;
  google.protobuf.Timestamp deleted_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  uint32 files = 6;
  uint64 bytes = 7;
}

message ExtensionLibraryGraceEntry {
  string grace_id = 1;
  string extension_id = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  uint32 files = 6;
  uint64 bytes = 7;
}

// Opaque, process-local surface authority. The endpoint is connection-owned
// and expires with its exact installed Resource generation.
message ExtensionMainViewSurface {
  string surface_id = 1;
  string extension_id = 2;
  ExtensionResourceOwner owner = 3;
  string endpoint = 4;
  optional string title = 5;
  ExtensionMainViewIcon icon = 6;
  google.protobuf.Timestamp expires_at = 7;
  string backend_id = 8;
  Revision backend_revision = 9;
  uint64 backend_generation = 10;
}

// Generic Extension projection. Executable bytes and secrets are deliberately
// absent: owner carries only exact Resource/MCP references and setup carries
// protected credential readiness.
message ExtensionCatalogEntry {
  string extension_id = 1;
  Revision revision = 2;
  ExtensionOwner owner = 3;
  ExtensionCatalogSource source = 4;
  bool installed = 5;
  ExtensionInstallState install_state = 6;
  string name = 7;
  optional string version = 8;
  optional string author = 9;
  string description = 10;
  bool enabled = 11;
  bool sidebar_supported = 12;
  bool sidebar_visible = 13;
  repeated ExtensionToolDescriptor tools = 14;
  repeated ExtensionPermissionDescriptor permissions = 15;
  repeated ExtensionCommandDescriptor commands = 16;
  ExtensionSetupDescriptor setup = 17;
  bool use_supported = 18;
  optional string error = 19;
  optional ExtensionPackageUpdate update = 20;
  optional ExtensionMainViewDescriptor main_view = 21;
  optional ExtensionLibraryDescriptor library = 22;
}

message ExtensionCatalogSnapshot {
  Revision revision = 1;
  repeated ExtensionCatalogEntry entries = 2;
  bool recovered_from_corruption = 3;
}
