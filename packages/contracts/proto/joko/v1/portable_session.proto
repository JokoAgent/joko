syntax = "proto3";

package joko.v1;

import "google/protobuf/timestamp.proto";
import "joko/v1/capability.proto";
import "joko/v1/common.proto";
import "joko/v1/model.proto";
import "joko/v1/workspace.proto";

enum PortableSessionFidelity {
  PORTABLE_SESSION_FIDELITY_UNSPECIFIED = 0;
  PORTABLE_SESSION_FIDELITY_FULL = 1;
  PORTABLE_SESSION_FIDELITY_PARTIAL = 2;
  PORTABLE_SESSION_FIDELITY_PRODUCT_ONLY = 3;
}

enum PortableSessionImportStatus {
  PORTABLE_SESSION_IMPORT_STATUS_UNSPECIFIED = 0;
  PORTABLE_SESSION_IMPORT_STATUS_READY = 1;
  PORTABLE_SESSION_IMPORT_STATUS_IMPORTED_ACTIVATION_FAILED = 2;
}

message PortableSessionImportPreview {
  string title = 1;
  WorkspaceKind workspace_kind = 2;
  google.protobuf.Timestamp exported_at = 3;
  string application_version = 4;
  uint32 format_version = 5;
  string backend_capability = 6;
  PortableSessionFidelity fidelity = 7;
  uint64 message_count = 8;
  uint64 media_count = 9;
  uint64 worker_count = 10;
  bool native_history = 11;
}

message PortableSessionImportDraft {
  string draft_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  bool encrypted = 3;
  bool password_required = 4;
  optional PortableSessionImportPreview preview = 5;
}

message ExportPortableSessionRequest {
  string session_id = 1;
  // Transient secret: implementations must never copy it into an Operation,
  // Event, Setting, diagnostic, Session file, workspace file, or log.
  optional string password = 2;
  bool exclude_media = 3;
}

message ExportPortableSessionResponse {
  BlobRef artifact = 1;
  PortableSessionFidelity fidelity = 2;
  uint64 message_count = 3;
  uint64 media_count = 4;
  uint64 missing_media_count = 5;
  uint64 worker_count = 6;
  uint64 media_bytes = 7;
}

message InspectPortableSessionImportRequest {
  BlobRef package = 1;
}

message InspectPortableSessionImportResponse {
  PortableSessionImportDraft draft = 1;
}

message UnlockPortableSessionImportRequest {
  string draft_id = 1;
  // Transient secret with the same non-persistence boundary as export.
  string password = 2;
}

message UnlockPortableSessionImportResponse {
  PortableSessionImportDraft draft = 1;
}

message CancelPortableSessionImportRequest {
  string draft_id = 1;
}

message CancelPortableSessionImportResponse {
  bool cancelled = 1;
}

message CommitPortableSessionImportRequest {
  // Caller-generated durable idempotency key. The unlocked draft itself is
  // transient; the resulting Operation records only the package Blob identity.
  string operation_id = 1;
  string draft_id = 2;
  string target_id = 3;
  optional string title = 4;
  optional ModelSelection model = 5;
  PermissionMode permission_mode = 6;
  bool plan_mode = 7;
  bool overwrite = 8;
  bool use_worktree = 9;
  optional string worktree_source_ref = 10;
  bool refresh_worktree_remote = 11;
}

message PortableSessionImportResult {
  string session_id = 1;
  PortableSessionFidelity fidelity = 2;
  uint64 message_count = 3;
  uint64 media_count = 4;
  uint64 worker_count = 5;
  repeated string replaced_session_ids = 6;
  PortableSessionImportStatus status = 7;
  optional ErrorInfo activation_error = 8;
}

message CommitPortableSessionImportResponse {
  PortableSessionImportResult result = 1;
  bool replayed = 2;
}

message RetryPortableSessionActivationRequest {
  string session_id = 1;
}

message RetryPortableSessionActivationResponse {
  string session_id = 1;
  PortableSessionImportStatus status = 2;
  optional ErrorInfo activation_error = 3;
}

enum PortableReplacementNativeState {
  PORTABLE_REPLACEMENT_NATIVE_STATE_UNSPECIFIED = 0;
  PORTABLE_REPLACEMENT_NATIVE_STATE_PENDING = 1;
  PORTABLE_REPLACEMENT_NATIVE_STATE_DISPATCHED = 2;
  PORTABLE_REPLACEMENT_NATIVE_STATE_UNKNOWN = 3;
  PORTABLE_REPLACEMENT_NATIVE_STATE_COMPLETED = 4;
}

enum PortableReplacementWorktreeState {
  PORTABLE_REPLACEMENT_WORKTREE_STATE_UNSPECIFIED = 0;
  PORTABLE_REPLACEMENT_WORKTREE_STATE_PENDING = 1;
  PORTABLE_REPLACEMENT_WORKTREE_STATE_COMPLETED = 2;
}

enum PortableReplacementInspection {
  PORTABLE_REPLACEMENT_INSPECTION_UNSPECIFIED = 0;
  PORTABLE_REPLACEMENT_INSPECTION_PRESENT = 1;
  PORTABLE_REPLACEMENT_INSPECTION_ABSENT = 2;
  PORTABLE_REPLACEMENT_INSPECTION_UNKNOWN = 3;
}

message PortableReplacementCleanup {
  string imported_session_id = 1;
  PortableReplacementNativeState native_state = 2;
  PortableReplacementWorktreeState worktree_state = 3;
  uint64 revision = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message GetPortableReplacementCleanupRequest {
  string imported_session_id = 1;
}

message GetPortableReplacementCleanupResponse {
  optional PortableReplacementCleanup cleanup = 1;
}

message ReconcilePortableReplacementCleanupRequest {
  string imported_session_id = 1;
}

message ReconcilePortableReplacementCleanupResponse {
  PortableReplacementCleanup cleanup = 1;
  PortableReplacementInspection inspection = 2;
}

message RetryPortableReplacementCleanupRequest {
  string imported_session_id = 1;
  uint64 expected_revision = 2;
  bool confirm_native_delete = 3;
}

message RetryPortableReplacementCleanupResponse {
  PortableReplacementCleanup cleanup = 1;
  PortableReplacementInspection inspection = 2;
}

// A transient, purpose-bound grant for direct transfer between two paired nodes.
// The read secret never enters an Operation or an Event.
message PortableTaskCopyGrant {
  string transfer_id = 1;
  bytes read_secret = 2;
  string operation_id = 3;
  string source_server_id = 4;
  string destination_server_id = 5;
  string source_session_id = 6;
  uint64 source_session_generation = 7;
  google.protobuf.Timestamp expires_at = 8;
  PortableTaskCopyPart session_package = 9;
  PortableTaskCopyPart workspace_archive = 10;
  string source_title = 11;
  string source_backend_id = 12;
  WorkspaceKind source_workspace_kind = 13;
}

message PortableTaskCopyPart {
  string sha256 = 1;
  uint64 size = 2;
}

enum PortableTaskCopyPartKind {
  PORTABLE_TASK_COPY_PART_KIND_UNSPECIFIED = 0;
  PORTABLE_TASK_COPY_PART_KIND_SESSION = 1;
  PORTABLE_TASK_COPY_PART_KIND_WORKSPACE = 2;
}

message PreparePortableTaskCopyRequest {
  string operation_id = 1;
  string session_id = 2;
  uint64 expected_session_generation = 3;
  string destination_server_id = 4;
}

message PreparePortableTaskCopyResponse {
  PortableTaskCopyGrant grant = 1;
}

message ReadPortableTaskCopyRequest {
  string transfer_id = 1;
  string operation_id = 2;
  string destination_server_id = 3;
  PortableTaskCopyPartKind part = 4;
}

message ReadPortableTaskCopyResponse {
  uint64 offset = 1;
  bytes content = 2;
}

message CancelPortableTaskCopyRequest {
  string transfer_id = 1;
  string operation_id = 2;
}

message CancelPortableTaskCopyResponse {
  bool cancelled = 1;
}

message ImportPortableTaskCopyRequest {
  PortableTaskCopyGrant grant = 1;
  string source_origin = 2;
  // A v1 trusted-node invitation for the paired source route, when available.
  optional string source_invitation = 3;
  string backend_id = 4;
  // An explicit approved local project may hold the new isolated copy directory.
  optional string parent_target_id = 5;
  optional Revision expected_parent_revision = 6;
}

message PortableTaskCopySkippedFile {
  string relative_path = 1;
  string reason = 2;
}

message PortableTaskCopyReceipt {
  string operation_id = 1;
  string target_id = 2;
  PortableSessionImportResult task = 3;
  uint64 skipped_file_count = 4;
  repeated PortableTaskCopySkippedFile skipped_files = 5;
}

message ImportPortableTaskCopyResponse {
  PortableTaskCopyReceipt receipt = 1;
}

message GetPortableTaskCopyReceiptRequest {
  string operation_id = 1;
}

message GetPortableTaskCopyReceiptResponse {
  optional PortableTaskCopyReceipt receipt = 1;
}
