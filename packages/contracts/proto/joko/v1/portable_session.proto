syntax = "proto3";

package joko.v1;

import "google/protobuf/timestamp.proto";
import "joko/v1/capability.proto";
import "joko/v1/common.proto";
import "joko/v1/model.proto";
import "joko/v1/workspace.proto";

enum PortableSessionFidelity {
  PORTABLE_SESSION_FIDELITY_UNSPECIFIED = 0;
  PORTABLE_SESSION_FIDELITY_FULL = 1;
  PORTABLE_SESSION_FIDELITY_PARTIAL = 2;
  PORTABLE_SESSION_FIDELITY_PRODUCT_ONLY = 3;
}

enum PortableSessionImportStatus {
  PORTABLE_SESSION_IMPORT_STATUS_UNSPECIFIED = 0;
  PORTABLE_SESSION_IMPORT_STATUS_READY = 1;
  PORTABLE_SESSION_IMPORT_STATUS_IMPORTED_ACTIVATION_FAILED = 2;
}

message PortableSessionImportPreview {
  string title = 1;
  WorkspaceKind workspace_kind = 2;
  google.protobuf.Timestamp exported_at = 3;
  string application_version = 4;
  uint32 format_version = 5;
  string backend_capability = 6;
  PortableSessionFidelity fidelity = 7;
  uint64 message_count = 8;
  uint64 media_count = 9;
  uint64 worker_count = 10;
  bool native_history = 11;
}

message PortableSessionImportDraft {
  string draft_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  bool encrypted = 3;
  bool password_required = 4;
  optional PortableSessionImportPreview preview = 5;
}

message ExportPortableSessionRequest {
  string session_id = 1;
  // Transient secret: implementations must never copy it into an Operation,
  // Event, Setting, diagnostic, Session file, workspace file, or log.
  optional string password = 2;
  bool exclude_media = 3;
}

message ExportPortableSessionResponse {
  BlobRef artifact = 1;
  PortableSessionFidelity fidelity = 2;
  uint64 message_count = 3;
  uint64 media_count = 4;
  uint64 missing_media_count = 5;
  uint64 worker_count = 6;
  uint64 media_bytes = 7;
}

message InspectPortableSessionImportRequest {
  BlobRef package = 1;
}

message InspectPortableSessionImportResponse {
  PortableSessionImportDraft draft = 1;
}

message UnlockPortableSessionImportRequest {
  string draft_id = 1;
  // Transient secret with the same non-persistence boundary as export.
  string password = 2;
}

message UnlockPortableSessionImportResponse {
  PortableSessionImportDraft draft = 1;
}

message CancelPortableSessionImportRequest {
  string draft_id = 1;
}

message CancelPortableSessionImportResponse {
  bool cancelled = 1;
}

message CommitPortableSessionImportRequest {
  // Caller-generated durable idempotency key. The unlocked draft itself is
  // transient; the resulting Operation records only the package Blob identity.
  string operation_id = 1;
  string draft_id = 2;
  string target_id = 3;
  optional string title = 4;
  optional ModelSelection model = 5;
  PermissionMode permission_mode = 6;
  bool plan_mode = 7;
  bool overwrite = 8;
  bool use_worktree = 9;
  optional string worktree_source_ref = 10;
  bool refresh_worktree_remote = 11;
}

message PortableSessionImportResult {
  string session_id = 1;
  PortableSessionFidelity fidelity = 2;
  uint64 message_count = 3;
  uint64 media_count = 4;
  uint64 worker_count = 5;
  repeated string replaced_session_ids = 6;
  PortableSessionImportStatus status = 7;
  optional ErrorInfo activation_error = 8;
}

message CommitPortableSessionImportResponse {
  PortableSessionImportResult result = 1;
  bool replayed = 2;
}

message RetryPortableSessionActivationRequest {
  string session_id = 1;
}

message RetryPortableSessionActivationResponse {
  string session_id = 1;
  PortableSessionImportStatus status = 2;
  optional ErrorInfo activation_error = 3;
}
