syntax = "proto3";

package joko.v1;

import "google/protobuf/timestamp.proto";
import "joko/v1/capability.proto";
import "joko/v1/common.proto";
import "joko/v1/operation.proto";

// Keys belong to the authenticated service node, never a client-selected path.
service SshKeyService {
  rpc ListSshKeys(ListSshKeysRequest) returns (ListSshKeysResponse);
  rpc BeginSshKeyPassphraseUpload(BeginSshKeyPassphraseUploadRequest) returns (BeginSshKeyPassphraseUploadResponse);
  rpc GenerateSshKey(GenerateSshKeyRequest) returns (GenerateSshKeyResponse);
  rpc AddSshKeyToAgent(AddSshKeyToAgentRequest) returns (AddSshKeyToAgentResponse);
  rpc ReadSshPublicKey(ReadSshPublicKeyRequest) returns (ReadSshPublicKeyResponse);
  rpc GetSshKeyInstallCommand(GetSshKeyInstallCommandRequest) returns (GetSshKeyInstallCommandResponse);
}

enum SshAgentState {
  SSH_AGENT_STATE_UNSPECIFIED = 0;
  SSH_AGENT_STATE_READY = 1;
  SSH_AGENT_STATE_UNAVAILABLE = 2;
  SSH_AGENT_STATE_FAILED = 3;
}

enum SshKeyPassphrasePurpose {
  SSH_KEY_PASSPHRASE_PURPOSE_UNSPECIFIED = 0;
  SSH_KEY_PASSPHRASE_PURPOSE_GENERATE = 1;
  SSH_KEY_PASSPHRASE_PURPOSE_AGENT_ADD = 2;
}

enum SshInstallShell {
  SSH_INSTALL_SHELL_UNSPECIFIED = 0;
  SSH_INSTALL_SHELL_POSIX = 1;
  SSH_INSTALL_SHELL_POWERSHELL = 2;
}

message SshKey {
  string id = 1;
  string name = 2;
  string algorithm = 3;
  string comment = 4;
  string sha256_fingerprint = 5;
  google.protobuf.Timestamp modified_at = 6;
  bool in_agent = 7;
}
message ListSshKeysRequest {}
message ListSshKeysResponse {
  repeated SshKey keys = 1;
  SshAgentState agent_state = 2;
  bool generation_supported = 3;
}
message BeginSshKeyPassphraseUploadRequest {
  SshKeyPassphrasePurpose purpose = 1;
  string key_id = 2;
  string expected_fingerprint = 3;
}
message BeginSshKeyPassphraseUploadResponse { CredentialUploadTicket ticket = 1; }
message GenerateSshKeyRequest {
  string name = 1;
  string comment = 2;
  optional string passphrase_upload_ticket_id = 3;
}
message GenerateSshKeyResponse { SshKey key = 1; }
message AddSshKeyToAgentRequest {
  string key_id = 1;
  string expected_fingerprint = 2;
  optional string passphrase_upload_ticket_id = 3;
}
message AddSshKeyToAgentResponse {}
message ReadSshPublicKeyRequest {
  string key_id = 1;
  string expected_fingerprint = 2;
}
message ReadSshPublicKeyResponse { string public_key = 1; }
message GetSshKeyInstallCommandRequest {
  string key_id = 1;
  string expected_fingerprint = 2;
  oneof destination {
    SshKeySavedHost saved_host = 3;
    SshKeyDraftHost draft_host = 4;
  }
  SshInstallShell shell = 5;
}
message SshKeySavedHost {
  string target_id = 1;
  string host_id = 2;
  Revision expected_revision = 3;
}
message SshKeyDraftHost {
  string hostname = 1;
  string user = 2;
  uint32 port = 3;
}
message SshKeyReference {
  string id = 1;
  string expected_fingerprint = 2;
}
message GetSshKeyInstallCommandResponse { string command = 1; }

// Authenticated, owner-bound Remote Host catalog and connection control.
// The owner identity is derived from the service context and is intentionally
// absent from every request so a client cannot select another owner's scope.
service RemoteHostService {
  rpc GetRemoteHostCapabilities(GetRemoteHostCapabilitiesRequest) returns (GetRemoteHostCapabilitiesResponse);
  rpc ListRemoteHosts(ListRemoteHostsRequest) returns (ListRemoteHostsResponse);
  rpc GetRemoteHost(GetRemoteHostRequest) returns (GetRemoteHostResponse);
  // Emits one authoritative initial catalog snapshot, then ordered changes for
  // this authenticated owner and exact target until the stream ends.
  rpc WatchRemoteHosts(WatchRemoteHostsRequest) returns (stream WatchRemoteHostsResponse);
  rpc RefreshRemoteHostCatalog(RefreshRemoteHostCatalogRequest) returns (RefreshRemoteHostCatalogResponse);
  rpc CreateRemoteHost(CreateRemoteHostRequest) returns (CreateRemoteHostResponse);
  rpc UpdateRemoteHost(UpdateRemoteHostRequest) returns (UpdateRemoteHostResponse);
  rpc DeleteRemoteHost(DeleteRemoteHostRequest) returns (DeleteRemoteHostResponse);
  rpc ConnectRemoteHost(ConnectRemoteHostRequest) returns (ConnectRemoteHostResponse);
  rpc DisconnectRemoteHost(DisconnectRemoteHostRequest) returns (DisconnectRemoteHostResponse);
  rpc TestRemoteHostConnection(TestRemoteHostConnectionRequest) returns (TestRemoteHostConnectionResponse);
  rpc ClearRemoteHostTrust(ClearRemoteHostTrustRequest) returns (ClearRemoteHostTrustResponse);
  // Runtime identity is derived from target_id. Clients cannot select a
  // Backend implementation or a remote filesystem location.
  rpc ProbeRemoteBackendRuntime(ProbeRemoteBackendRuntimeRequest) returns (ProbeRemoteBackendRuntimeResponse);
  // The service owns the mutation after admission. A disconnected observer
  // may attach again with the same request_id, while a different mutation for
  // the same Target/Host is rejected until the first one reaches a terminal phase.
  rpc InstallRemoteBackendRuntime(InstallRemoteBackendRuntimeRequest) returns (stream InstallRemoteBackendRuntimeResponse);
  rpc UninstallRemoteBackendRuntime(UninstallRemoteBackendRuntimeRequest) returns (UninstallRemoteBackendRuntimeResponse);
}

// Catalog and management remain usable when a connector is unavailable. This
// closed descriptor lets clients gate each public behavior independently.
enum RemoteHostCapabilityKind {
  REMOTE_HOST_CAPABILITY_KIND_UNSPECIFIED = 0;
  REMOTE_HOST_CAPABILITY_KIND_CATALOG = 1;
  REMOTE_HOST_CAPABILITY_KIND_MANAGEMENT = 2;
  REMOTE_HOST_CAPABILITY_KIND_CONNECTION_CONTROL = 3;
  REMOTE_HOST_CAPABILITY_KIND_CONNECTION_TEST = 4;
  REMOTE_HOST_CAPABILITY_KIND_TRUST_RESET = 5;
  REMOTE_HOST_CAPABILITY_KIND_COMMAND_EXECUTION = 6;
  REMOTE_HOST_CAPABILITY_KIND_PROCESS_STREAMING = 7;
  REMOTE_HOST_CAPABILITY_KIND_FILE_TRANSFER = 8;
  REMOTE_HOST_CAPABILITY_KIND_TCP_FORWARDING = 9;
  REMOTE_HOST_CAPABILITY_KIND_BACKEND_RUNTIME_SETUP = 10;
}

message RemoteHostCapabilityDescriptor {
  RemoteHostCapabilityKind kind = 1;
  string name = 2;
  CapabilitySupport support = 3;
}

enum RemoteHostSource {
  REMOTE_HOST_SOURCE_UNSPECIFIED = 0;
  REMOTE_HOST_SOURCE_MANUAL = 1;
  REMOTE_HOST_SOURCE_SSH_CONFIG = 2;
}

enum RemoteHostAuthenticationMode {
  REMOTE_HOST_AUTHENTICATION_MODE_UNSPECIFIED = 0;
  // Uses only the service-owned agent endpoint; no endpoint path crosses this contract.
  REMOTE_HOST_AUTHENTICATION_MODE_SYSTEM_AGENT = 1;
  // Resolves credential_reference_id only inside the authenticated Orchestrator runtime.
  REMOTE_HOST_AUTHENTICATION_MODE_PRIVATE_KEY = 2;
  // Only this fingerprint-checked node key may authenticate through the agent.
  REMOTE_HOST_AUTHENTICATION_MODE_NODE_KEY = 3;
}

enum RemoteHostStatus {
  REMOTE_HOST_STATUS_UNSPECIFIED = 0;
  REMOTE_HOST_STATUS_DISCONNECTED = 1;
  REMOTE_HOST_STATUS_CONNECTING = 2;
  REMOTE_HOST_STATUS_AUTHENTICATING = 3;
  REMOTE_HOST_STATUS_READY = 4;
  REMOTE_HOST_STATUS_FAILED = 5;
}

// Closed, content-free failure taxonomy. Retryability is derived by the
// service from this code; connector text and diagnostics are not representable.
enum RemoteHostFailureCode {
  REMOTE_HOST_FAILURE_CODE_UNSPECIFIED = 0;
  REMOTE_HOST_FAILURE_CODE_ABORTED = 1;
  REMOTE_HOST_FAILURE_CODE_AUTHENTICATION_FAILED = 2;
  REMOTE_HOST_FAILURE_CODE_CONNECTION_FAILED = 3;
  REMOTE_HOST_FAILURE_CODE_CONNECTION_TIMEOUT = 4;
  REMOTE_HOST_FAILURE_CODE_CONNECTOR_PROTOCOL = 5;
  REMOTE_HOST_FAILURE_CODE_CONNECTOR_UNAVAILABLE = 6;
  REMOTE_HOST_FAILURE_CODE_HOST_KEY_CHANGED = 7;
  REMOTE_HOST_FAILURE_CODE_HOST_KEY_CONFLICT = 8;
  REMOTE_HOST_FAILURE_CODE_HOST_KEY_INVALID = 9;
  REMOTE_HOST_FAILURE_CODE_HOST_KEY_MISSING = 10;
  REMOTE_HOST_FAILURE_CODE_HOST_KEY_STORE_CORRUPT = 11;
  REMOTE_HOST_FAILURE_CODE_HOST_KEY_STORE_MISSING = 12;
  REMOTE_HOST_FAILURE_CODE_HOST_KEY_STORE_UNREADABLE = 13;
  REMOTE_HOST_FAILURE_CODE_HOST_KEY_STORE_WRITE_FAILED = 14;
  REMOTE_HOST_FAILURE_CODE_NODE_KEY_CHANGED = 15;
  REMOTE_HOST_FAILURE_CODE_NODE_KEY_UNAVAILABLE = 16;
}

message RemoteHostFailure {
  RemoteHostFailureCode code = 1;
  bool retryable = 2;
}

message RemoteHostTrustPin {
  string algorithm = 1;
  // Public SHA256 fingerprint only. The presented host key is never exposed.
  string sha256_fingerprint = 2;
  google.protobuf.Timestamp pinned_at = 3;
}

message RemoteHostStatusSnapshot {
  RemoteHostStatus state = 1;
  google.protobuf.Timestamp changed_at = 2;
  // Present only while state is FAILED.
  RemoteHostFailure failure = 3;
}

message RemoteHost {
  string target_id = 1;
  string host_id = 2;
  string hostname = 3;
  uint32 port = 4;
  string user = 5;
  RemoteHostSource source = 6;
  // Opaque reference only; credential material uses the credential channel.
  optional string credential_reference_id = 7;
  RemoteHostTrustPin trust = 8;
  RemoteHostStatusSnapshot status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  Revision revision = 12;
  RemoteHostAuthenticationMode authentication_mode = 13;
  SshKeyReference node_key = 14;
}

message GetRemoteHostCapabilitiesRequest {
  string target_id = 1;
}

message GetRemoteHostCapabilitiesResponse {
  repeated RemoteHostCapabilityDescriptor capabilities = 1;
  google.protobuf.Timestamp observed_at = 2;
}

message ListRemoteHostsRequest {
  string target_id = 1;
  PageRequest page = 2;
}

message ListRemoteHostsResponse {
  repeated RemoteHost hosts = 1;
  PageInfo page = 2;
}

message GetRemoteHostRequest {
  string target_id = 1;
  string host_id = 2;
}

message GetRemoteHostResponse {
  RemoteHost host = 1;
}

message WatchRemoteHostsRequest {
  string target_id = 1;
}

message RemoteHostCatalogSnapshot {
  repeated RemoteHost hosts = 1;
  google.protobuf.Timestamp observed_at = 2;
}

enum RemoteHostChangeKind {
  REMOTE_HOST_CHANGE_KIND_UNSPECIFIED = 0;
  REMOTE_HOST_CHANGE_KIND_UPSERTED = 1;
  REMOTE_HOST_CHANGE_KIND_DELETED = 2;
}

message RemoteHostChange {
  RemoteHostChangeKind kind = 1;
  // The last complete public projection, including for a deletion.
  RemoteHost host = 2;
  google.protobuf.Timestamp observed_at = 3;
}

message WatchRemoteHostsResponse {
  oneof update {
    RemoteHostCatalogSnapshot snapshot = 1;
    RemoteHostChange change = 2;
  }
  // Strictly increasing within one stream. Reconnects begin with a new
  // authoritative snapshot, so clients never need an opaque resume token.
  uint64 sequence = 3;
}

// Re-reads the service-owned catalog source. No client-selected path crosses
// the contract boundary.
message RefreshRemoteHostCatalogRequest {
  string target_id = 1;
  string request_id = 2;
}

message RefreshRemoteHostCatalogResponse {
  repeated RemoteHost hosts = 1;
  google.protobuf.Timestamp refreshed_at = 2;
}

message CreateRemoteHostRequest {
  string request_id = 1;
  string target_id = 2;
  string host_id = 3;
  string hostname = 4;
  uint32 port = 5;
  string user = 6;
  optional string credential_reference_id = 7;
  RemoteHostAuthenticationMode authentication_mode = 8;
  SshKeyReference node_key = 9;
}

message CreateRemoteHostResponse {
  RemoteHost host = 1;
}

// Full routing replacement. An absent credential reference explicitly clears
// the previous opaque reference; endpoint changes can require trust reset.
message UpdateRemoteHostRequest {
  string target_id = 1;
  string host_id = 2;
  string hostname = 3;
  uint32 port = 4;
  string user = 5;
  optional string credential_reference_id = 6;
  Revision expected_revision = 7;
  RemoteHostAuthenticationMode authentication_mode = 8;
  SshKeyReference node_key = 9;
}

message UpdateRemoteHostResponse {
  RemoteHost host = 1;
}

message DeleteRemoteHostRequest {
  string target_id = 1;
  string host_id = 2;
  Revision expected_revision = 3;
}

message DeleteRemoteHostResponse {
  RemoteHost host = 1;
}

message ConnectRemoteHostRequest {
  string target_id = 1;
  string host_id = 2;
  Revision expected_revision = 3;
}

message ConnectRemoteHostResponse {
  RemoteHost host = 1;
}

message DisconnectRemoteHostRequest {
  string target_id = 1;
  string host_id = 2;
  Revision expected_revision = 3;
}

message DisconnectRemoteHostResponse {
  RemoteHost host = 1;
}

enum RemoteHostConnectionTestOutcome {
  REMOTE_HOST_CONNECTION_TEST_OUTCOME_UNSPECIFIED = 0;
  REMOTE_HOST_CONNECTION_TEST_OUTCOME_SUCCEEDED = 1;
  REMOTE_HOST_CONNECTION_TEST_OUTCOME_FAILED = 2;
}

message TestRemoteHostConnectionRequest {
  string target_id = 1;
  string host_id = 2;
  Revision expected_revision = 3;
}

message RemoteHostConnectionTestResult {
  RemoteHostConnectionTestOutcome outcome = 1;
  RemoteHost host = 2;
  google.protobuf.Timestamp tested_at = 3;
}

message TestRemoteHostConnectionResponse {
  RemoteHostConnectionTestResult result = 1;
}

message ClearRemoteHostTrustRequest {
  string target_id = 1;
  string host_id = 2;
  Revision expected_revision = 3;
}

message ClearRemoteHostTrustResponse {
  RemoteHost host = 1;
}

enum RemoteBackendRuntimeState {
  REMOTE_BACKEND_RUNTIME_STATE_UNSPECIFIED = 0;
  REMOTE_BACKEND_RUNTIME_STATE_PROBING = 1;
  REMOTE_BACKEND_RUNTIME_STATE_NOT_INSTALLED = 2;
  REMOTE_BACKEND_RUNTIME_STATE_INSTALLING = 3;
  REMOTE_BACKEND_RUNTIME_STATE_READY = 4;
  REMOTE_BACKEND_RUNTIME_STATE_FAILED = 5;
  // A remote effect may have completed after its SSH authority disappeared.
  // A fresh read-only probe is the only valid recovery path.
  REMOTE_BACKEND_RUNTIME_STATE_OUTCOME_UNKNOWN = 6;
}

enum RemoteBackendRuntimeFailureCode {
  REMOTE_BACKEND_RUNTIME_FAILURE_CODE_UNSPECIFIED = 0;
  REMOTE_BACKEND_RUNTIME_FAILURE_CODE_ABORTED = 1;
  REMOTE_BACKEND_RUNTIME_FAILURE_CODE_AUTHORITY_CHANGED = 2;
  REMOTE_BACKEND_RUNTIME_FAILURE_CODE_HOST_NOT_READY = 3;
  REMOTE_BACKEND_RUNTIME_FAILURE_CODE_NOT_SUPPORTED = 4;
  REMOTE_BACKEND_RUNTIME_FAILURE_CODE_PROBE_FAILED = 5;
  REMOTE_BACKEND_RUNTIME_FAILURE_CODE_INSTALL_FAILED = 6;
  REMOTE_BACKEND_RUNTIME_FAILURE_CODE_UNINSTALL_FAILED = 7;
  REMOTE_BACKEND_RUNTIME_FAILURE_CODE_BUSY = 8;
}

message RemoteBackendRuntimeFailure {
  RemoteBackendRuntimeFailureCode code = 1;
  bool retryable = 2;
}

// Capability-neutral projection of the one Backend runtime derived from a
// Target. It deliberately excludes commands, paths, logs and credentials.
message RemoteBackendRuntime {
  string target_id = 1;
  string host_id = 2;
  string display_name = 3;
  string expected_version = 4;
  optional string installed_version = 5;
  RemoteBackendRuntimeState state = 6;
  bool can_install = 7;
  bool can_reinstall = 8;
  bool can_uninstall = 9;
  RemoteBackendRuntimeFailure failure = 10;
  google.protobuf.Timestamp observed_at = 11;
  Revision target_revision = 12;
  Revision host_revision = 13;
}

message ProbeRemoteBackendRuntimeRequest {
  string target_id = 1;
  string host_id = 2;
  Revision expected_target_revision = 3;
  Revision expected_host_revision = 4;
}

message ProbeRemoteBackendRuntimeResponse {
  RemoteBackendRuntime runtime = 1;
}

enum RemoteBackendRuntimeInstallPhase {
  REMOTE_BACKEND_RUNTIME_INSTALL_PHASE_UNSPECIFIED = 0;
  REMOTE_BACKEND_RUNTIME_INSTALL_PHASE_PROBING = 1;
  REMOTE_BACKEND_RUNTIME_INSTALL_PHASE_DOWNLOADING = 2;
  REMOTE_BACKEND_RUNTIME_INSTALL_PHASE_INSTALLING = 3;
  REMOTE_BACKEND_RUNTIME_INSTALL_PHASE_VALIDATING = 4;
  REMOTE_BACKEND_RUNTIME_INSTALL_PHASE_COMPLETE = 5;
  REMOTE_BACKEND_RUNTIME_INSTALL_PHASE_FAILED = 6;
  REMOTE_BACKEND_RUNTIME_INSTALL_PHASE_OUTCOME_UNKNOWN = 7;
}

message InstallRemoteBackendRuntimeRequest {
  string request_id = 1;
  string target_id = 2;
  string host_id = 3;
  Revision expected_target_revision = 4;
  Revision expected_host_revision = 5;
  bool reinstall = 6;
}

message InstallRemoteBackendRuntimeResponse {
  string request_id = 1;
  uint64 sequence = 2;
  RemoteBackendRuntimeInstallPhase phase = 3;
  RemoteBackendRuntime runtime = 4;
  google.protobuf.Timestamp observed_at = 5;
}

message UninstallRemoteBackendRuntimeRequest {
  string request_id = 1;
  string target_id = 2;
  string host_id = 3;
  Revision expected_target_revision = 4;
  Revision expected_host_revision = 5;
}

message UninstallRemoteBackendRuntimeResponse {
  RemoteBackendRuntime runtime = 1;
}
