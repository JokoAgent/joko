syntax = "proto3";

package joko.v1;

// Capability-neutral execution/filesystem location. Host credentials and
// presented keys are intentionally not representable.
message RemoteWorkspaceBinding {
  string host_id = 1;
  string workspace_root_display = 2;
}

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// A monotonically increasing revision within the named projection scope.
message Revision {
  uint64 value = 1;
  string etag = 2;
}

// Cursor for resuming a durable event stream.
message EventCursor {
  string opaque_token = 1;
  uint64 sequence = 2;
  uint64 generation = 3;
  google.protobuf.Timestamp issued_at = 4;
}

message PageRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message PageInfo {
  string next_page_token = 1;
  uint64 total_size = 2;
}

message EntityVersion {
  Revision revision = 1;
  uint64 generation = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message EntityRef {
  EntityKind kind = 1;
  string id = 2;
  string display_name = 3;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_CONNECTION = 1;
  ENTITY_KIND_DEVICE = 2;
  ENTITY_KIND_BACKEND = 3;
  ENTITY_KIND_TARGET = 4;
  ENTITY_KIND_SESSION = 5;
  ENTITY_KIND_RUN = 6;
  ENTITY_KIND_ATTEMPT = 7;
  ENTITY_KIND_QUEUE_ITEM = 8;
  ENTITY_KIND_SCHEDULE = 9;
  ENTITY_KIND_OPERATION = 10;
  ENTITY_KIND_INTERACTION = 11;
  ENTITY_KIND_WORKSPACE = 12;
  ENTITY_KIND_ARTIFACT = 13;
  ENTITY_KIND_TOOL = 14;
  ENTITY_KIND_TOOL_LEASE = 15;
  ENTITY_KIND_BACKGROUND_TASK = 16;
  ENTITY_KIND_PROVIDER = 17;
  ENTITY_KIND_MODEL = 18;
  ENTITY_KIND_RESOURCE = 19;
  ENTITY_KIND_BROWSER_PAGE = 20;
  ENTITY_KIND_QUEUE_CONTROL = 21;
  ENTITY_KIND_REVIEW_RUN = 22;
  ENTITY_KIND_DEVICE_CONTROL_RELATION = 23;
  ENTITY_KIND_OBJECTIVE = 24;
}

message TraceContext {
  string trace_id = 1;
  string span_id = 2;
  string parent_span_id = 3;
}

message ActorRef {
  ActorKind kind = 1;
  string id = 2;
  string display_name = 3;
}

enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;
  ACTOR_KIND_OWNER = 1;
  ACTOR_KIND_CONNECTION = 2;
  ACTOR_KIND_SCHEDULE = 3;
  ACTOR_KIND_ORCHESTRATOR = 4;
  ACTOR_KIND_BACKEND = 5;
  ACTOR_KIND_TOOL_PROVIDER = 6;
}

// Durable identity attached to events. Empty IDs mean the scope does not apply.
message EventIdentity {
  string backend_id = 1;
  string target_id = 2;
  string session_id = 3;
  string run_id = 4;
  string attempt_id = 5;
  string operation_id = 6;
  string queue_item_id = 7;
  string tool_lease_id = 8;
  uint64 generation = 9;
  uint64 sequence = 10;
  TraceContext trace = 11;
}

message BlobRef {
  string blob_id = 1;
  string file_name = 2;
  string media_type = 3;
  uint64 byte_size = 4;
  string sha256_hex = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  BlobDisposition disposition = 8;
}

enum BlobDisposition {
  BLOB_DISPOSITION_UNSPECIFIED = 0;
  BLOB_DISPOSITION_ATTACHMENT = 1;
  BLOB_DISPOSITION_INLINE = 2;
  BLOB_DISPOSITION_ARTIFACT = 3;
  BLOB_DISPOSITION_EXPORT = 4;
  BLOB_DISPOSITION_TOOL_OUTPUT = 5;
  BLOB_DISPOSITION_SCREENSHOT = 6;
}

message ImageRef {
  BlobRef blob = 1;
  uint32 width_pixels = 2;
  uint32 height_pixels = 3;
  string alt_text = 4;
}

message ArtifactRef {
  string artifact_id = 1;
  BlobRef blob = 2;
  ArtifactKind kind = 3;
  string title = 4;
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_FILE = 1;
  ARTIFACT_KIND_IMAGE = 2;
  ARTIFACT_KIND_EXPORT = 3;
  ARTIFACT_KIND_TOOL_RESULT = 4;
  ARTIFACT_KIND_DIAGNOSTICS = 5;
  ARTIFACT_KIND_DIFF = 6;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cache_read_tokens = 3;
  uint64 cache_write_tokens = 4;
  uint64 total_tokens = 5;
  int64 cost_micros = 6;
  string currency_code = 7;
}

message ContextUsage {
  uint64 used_tokens = 1;
  uint64 context_window_tokens = 2;
  uint64 reserved_tokens = 3;
  double utilization_ratio = 4;
  Usage cumulative_usage = 5;
  google.protobuf.Timestamp measured_at = 6;
}

enum ErrorSeverity {
  ERROR_SEVERITY_UNSPECIFIED = 0;
  ERROR_SEVERITY_WAITING = 1;
  ERROR_SEVERITY_RETRYABLE = 2;
  ERROR_SEVERITY_BLOCKED = 3;
  ERROR_SEVERITY_FATAL = 4;
}

enum StateImpact {
  STATE_IMPACT_UNSPECIFIED = 0;
  STATE_IMPACT_UNCHANGED = 1;
  STATE_IMPACT_CHANGED = 2;
  STATE_IMPACT_MAY_HAVE_CHANGED = 3;
  STATE_IMPACT_UNKNOWN = 4;
}

enum RecoveryActionKind {
  RECOVERY_ACTION_KIND_UNSPECIFIED = 0;
  RECOVERY_ACTION_KIND_WAIT = 1;
  RECOVERY_ACTION_KIND_RETRY = 2;
  RECOVERY_ACTION_KIND_RECONNECT = 3;
  RECOVERY_ACTION_KIND_REAUTHENTICATE = 4;
  RECOVERY_ACTION_KIND_RESOLVE_INTERACTION = 5;
  RECOVERY_ACTION_KIND_SELECT_NEW_SESSION = 6;
  RECOVERY_ACTION_KIND_OPEN_DIAGNOSTICS = 7;
  RECOVERY_ACTION_KIND_CONTACT_OWNER = 8;
  RECOVERY_ACTION_KIND_ABORT = 9;
}

message RecoveryAction {
  RecoveryActionKind kind = 1;
  string label = 2;
  google.protobuf.Duration retry_after = 3;
}

// Stable, sanitized error information safe for UI and downloadable diagnostics.
message ErrorInfo {
  string code = 1;
  string phase = 2;
  string message = 3;
  ErrorSeverity severity = 4;
  bool retryable = 5;
  StateImpact queue_impact = 6;
  StateImpact workspace_impact = 7;
  StateImpact native_session_impact = 8;
  repeated RecoveryAction recovery_actions = 9;
  string diagnostic_id = 10;
}

message TextRange {
  uint64 start_byte = 1;
  uint64 end_byte = 2;
  uint32 start_line = 3;
  uint32 start_column = 4;
  uint32 end_line = 5;
  uint32 end_column = 6;
}

message StringValue {
  string value = 1;
}

message BoolValue {
  bool value = 1;
}

message UInt64Value {
  uint64 value = 1;
}

message DurationValue {
  google.protobuf.Duration value = 1;
}
