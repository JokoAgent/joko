enum WorkspaceEntryCreateKind {
  WORKSPACE_ENTRY_CREATE_KIND_UNSPECIFIED = 0;
  WORKSPACE_ENTRY_CREATE_KIND_FILE = 1;
  WORKSPACE_ENTRY_CREATE_KIND_DIRECTORY = 2;
}

// Creation is fenced by an atomic non-existence check at relative_path. Parent
// directories must already exist and are canonicalized again immediately
// before the effect.
message CreateWorkspaceEntryMutation {
  string workspace_id = 1;
  string relative_path = 2;
  WorkspaceEntryCreateKind kind = 3;
  // Must be the public workspaceEntryAbsentRevision sentinel. The filesystem
  // effect then enforces that absence atomically with wx/mkdir semantics.
  string expected_revision = 4;
}

message MoveWorkspaceEntryMutation {
  string workspace_id = 1;
  string source_relative_path = 2;
  string destination_relative_path = 3;
  string expected_revision = 4;
}

message DeleteWorkspaceEntryMutation {
  string workspace_id = 1;
  string relative_path = 2;
  string expected_revision = 3;
  // Required when the selected entry is a directory. The Files UI shows the
  // Destructive confirmation is required before setting this bit.
  bool confirm_recursive = 4;
}

message CopyWorkspaceEntryMutation {
  string workspace_id = 1;
  string source_relative_path = 2;
  string destination_relative_path = 3;
  string expected_revision = 4;
}

