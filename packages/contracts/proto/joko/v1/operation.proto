  BROWSER_TAKEOVER_NAVIGATION_COMMAND_KIND_FORWARD = 2;
  BROWSER_TAKEOVER_NAVIGATION_COMMAND_KIND_RELOAD = 3;
  BROWSER_TAKEOVER_NAVIGATION_COMMAND_KIND_STOP = 4;
}

