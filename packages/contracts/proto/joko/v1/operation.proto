    UploadBrowserFileMutation upload_browser_file = 111;
    UpdateBrowserSettingsMutation update_browser_settings = 112;
    DiscoverProjectResourcesMutation discover_project_resources = 113;
    AddResourceMutation add_resource = 114;
    BrowserTakeoverActionMutation browser_takeover_action = 115;
    ExecuteUserShellMutation execute_user_shell = 116;
    AbortUserShellMutation abort_user_shell = 117;
    UpdateMessageSearchSettingsMutation update_message_search_settings = 118;
    DeleteSessionMessageMutation delete_session_message = 119;
    ApplyWorkspaceDiffHunkMutation apply_workspace_diff_hunk = 120;
