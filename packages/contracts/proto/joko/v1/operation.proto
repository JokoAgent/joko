    RestartMcpServerMutation restart_mcp_server = 92;
    ApproveResourceMutation approve_resource = 93;
    InstallResourceMutation install_resource = 94;
    UpdateResourceMutation update_resource = 95;
    SetResourceEnabledMutation set_resource_enabled = 96;
