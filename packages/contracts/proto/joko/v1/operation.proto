  string page_id = 2;
}

message EndBrowserTakeoverMutation {
  string takeover_id = 1;
}

// One remotely-authoritative input against one exact human-takeover capability.
// The complete fence is repeated on every input so stale pages, generations,
// owners, and takeover IDs can never be confused with the current capability.
message BrowserTakeoverActionMutation {
  string browser_provider_id = 1;
  string page_id = 2;
  string takeover_id = 3;
  uint64 generation = 4;
  oneof action {
    BrowserTakeoverMouseClick mouse_click = 10;
    BrowserTakeoverScroll scroll = 11;
    BrowserTakeoverKeyPress key_press = 12;
    BrowserTakeoverTextInput text_input = 13;
    BrowserTakeoverNavigate navigate = 14;
    BrowserTakeoverNavigationCommand navigation_command = 15;
    BrowserTakeoverMouseMove mouse_move = 16;
    BrowserTakeoverMouseDrag mouse_drag = 17;
  }
}

message BrowserTakeoverMouseClick {
  // Coordinates are ratios over the screenshot presented to the human. 0 is
  // the left/top edge and 1 is the right/bottom edge. The Provider maps these
  // ratios to the current page's CSS viewport, independent of UI/image scale.
  double normalized_x = 1;
  double normalized_y = 2;
  BrowserTakeoverMouseButton button = 3;
  uint32 click_count = 4;
}

message BrowserTakeoverMouseMove {
  double normalized_x = 1;
  double normalized_y = 2;
}

message BrowserTakeoverMouseDrag {
  double start_normalized_x = 1;
  double start_normalized_y = 2;
  double end_normalized_x = 3;
  double end_normalized_y = 4;
  BrowserTakeoverMouseButton button = 5;
}

enum BrowserTakeoverMouseButton {
  BROWSER_TAKEOVER_MOUSE_BUTTON_UNSPECIFIED = 0;
  BROWSER_TAKEOVER_MOUSE_BUTTON_PRIMARY = 1;
  BROWSER_TAKEOVER_MOUSE_BUTTON_MIDDLE = 2;
  BROWSER_TAKEOVER_MOUSE_BUTTON_SECONDARY = 3;
}

message BrowserTakeoverScroll {
  // Playwright wheel deltas expressed in CSS pixels.
  sint32 delta_x_css_pixels = 1;
  sint32 delta_y_css_pixels = 2;
}

message BrowserTakeoverKeyPress {
  BrowserTakeoverKey key = 1;
  // Printable accelerator keys are carried separately from the named-key
  // enum. Exactly one of key or character must be populated.
  string character = 2;
  repeated BrowserTakeoverKeyModifier modifiers = 3;
}

enum BrowserTakeoverKeyModifier {
  BROWSER_TAKEOVER_KEY_MODIFIER_UNSPECIFIED = 0;
  BROWSER_TAKEOVER_KEY_MODIFIER_ALT = 1;
  BROWSER_TAKEOVER_KEY_MODIFIER_CONTROL = 2;
  BROWSER_TAKEOVER_KEY_MODIFIER_META = 3;
  BROWSER_TAKEOVER_KEY_MODIFIER_SHIFT = 4;
}

enum BrowserTakeoverKey {
  BROWSER_TAKEOVER_KEY_UNSPECIFIED = 0;
  BROWSER_TAKEOVER_KEY_ENTER = 1;
  BROWSER_TAKEOVER_KEY_TAB = 2;
  BROWSER_TAKEOVER_KEY_ESCAPE = 3;
  BROWSER_TAKEOVER_KEY_BACKSPACE = 4;
  BROWSER_TAKEOVER_KEY_DELETE = 5;
  BROWSER_TAKEOVER_KEY_ARROW_UP = 6;
  BROWSER_TAKEOVER_KEY_ARROW_DOWN = 7;
  BROWSER_TAKEOVER_KEY_ARROW_LEFT = 8;
  BROWSER_TAKEOVER_KEY_ARROW_RIGHT = 9;
  BROWSER_TAKEOVER_KEY_HOME = 10;
  BROWSER_TAKEOVER_KEY_END = 11;
  BROWSER_TAKEOVER_KEY_PAGE_UP = 12;
  BROWSER_TAKEOVER_KEY_PAGE_DOWN = 13;
  BROWSER_TAKEOVER_KEY_SPACE = 14;
}

message BrowserTakeoverTextInput {
  string text = 1;
}

message BrowserTakeoverNavigate {
  // Human-entered HTTP(S) URL (or about:blank). Orchestrator rejects embedded
  // credentials and durable credential-shaped URL material before dispatch.
  string url = 1;
}

message BrowserTakeoverNavigationCommand {
  BrowserTakeoverNavigationCommandKind command = 1;
}

enum BrowserTakeoverNavigationCommandKind {
  BROWSER_TAKEOVER_NAVIGATION_COMMAND_KIND_UNSPECIFIED = 0;
