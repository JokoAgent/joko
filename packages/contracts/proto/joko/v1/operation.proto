enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_ACCEPTED = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_WAITING = 3;
  OPERATION_STATE_SUCCEEDED = 4;
  OPERATION_STATE_FAILED = 5;
  OPERATION_STATE_CANCELLED = 6;
  OPERATION_STATE_CONFLICT = 7;
}

message Operation {
  string operation_id = 1;
  string connection_id = 2;
  string request_sha256_hex = 3;
  OperationState state = 4;
  OperationMutation mutation = 5;
  OperationResult result = 6;
  ErrorInfo error = 7;
  ActorRef actor = 8;
  uint64 generation = 9;
  google.protobuf.Timestamp accepted_at = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp completed_at = 12;
  EntityVersion version = 13;
}

message OperationPrecondition {
  EntityRef entity = 1;
  Revision expected_revision = 2;
  uint64 expected_generation = 3;
}

message OperationMutation {
  repeated OperationPrecondition preconditions = 1;
  oneof payload {
    RevokeDeviceMutation revoke_device = 10;
    LogoutConnectionMutation logout_connection = 11;
    RestartBackendMutation restart_backend = 12;
    CreateTargetMutation create_target = 13;
    UpdateTargetMutation update_target = 14;
    ArchiveTargetMutation archive_target = 15;
    DeleteTargetMutation delete_target = 16;
    CreateSessionMutation create_session = 20;
    ResumeSessionMutation resume_session = 21;
    DetachSessionMutation detach_session = 22;
    CloseSessionMutation close_session = 23;
    RenameSessionMutation rename_session = 24;
    PinSessionMutation pin_session = 25;
    ArchiveSessionMutation archive_session = 26;
    DeleteSessionMutation delete_session = 27;
    ForkSessionMutation fork_session = 28;
    CloneSessionMutation clone_session = 29;
    NavigateSessionBranchMutation navigate_session_branch = 30;
    CompactSessionMutation compact_session = 31;
    ExportSessionMutation export_session = 32;
    SetSessionModelMutation set_session_model = 33;
    SetSessionPermissionMutation set_session_permission = 34;
    SetSessionPlanModeMutation set_session_plan_mode = 35;
    MoveSessionProjectMutation move_session_project = 36;
    SendInputMutation send_input = 40;
    AbortRunMutation abort_run = 41;
    RetryRunMutation retry_run = 42;
    AbortRetryMutation abort_retry = 43;
    CancelQueueItemMutation cancel_queue_item = 44;
    EditQueueItemMutation edit_queue_item = 45;
    ReorderQueueItemMutation reorder_queue_item = 46;
    PauseQueueMutation pause_queue = 47;
    ResumeQueueMutation resume_queue = 48;
    SetQueueItemEditLockMutation set_queue_item_edit_lock = 49;
    SetQueueInteractionLockMutation set_queue_interaction_lock = 66;
    CreateScheduleMutation create_schedule = 50;
    UpdateScheduleMutation update_schedule = 51;
    DeleteScheduleMutation delete_schedule = 52;
    TriggerScheduleMutation trigger_schedule = 53;
    SetScheduleEnabledMutation set_schedule_enabled = 54;
    ReconcileProjectAutomationsMutation reconcile_project_automations = 55;
    PromoteScheduleToProjectMutation promote_schedule_to_project = 56;
    CloneProjectScheduleToUserMutation clone_project_schedule_to_user = 57;
    RemoveProjectScheduleMutation remove_project_schedule = 58;
    MarkScheduleRunReadMutation mark_schedule_run_read = 59;
    DeleteScheduleRunMutation delete_schedule_run = 62;
    RestartScheduleRunMutation restart_schedule_run = 63;
    MarkScheduleRunsReadMutation mark_schedule_runs_read = 64;
    MarkAllScheduleRunsReadMutation mark_all_schedule_runs_read = 65;
    ResolveInteractionMutation resolve_interaction = 60;
