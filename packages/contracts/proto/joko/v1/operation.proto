// Opens one new Browser page for an authenticated human and atomically moves
// that Connection's takeover to the new page. The optional Session scope keeps
// message-link opens attributable without exposing a service-local path.
message OpenBrowserPageMutation {
  string browser_provider_id = 1;
  string session_id = 2;
  string url = 3;
  // Provider generation observed by the authenticated client. Zero is valid
  // only while the Provider is stopped and has never started.
  uint64 expected_generation = 4;
  // When a takeover exists, all three source-fence fields are mandatory.
  string current_page_id = 5;
  string takeover_id = 6;
  // Optional durable lost-page descriptor replaced by this new page.
  string recovery_page_id = 7;
}

// Transfers one exact owned human capability to another live page.
message FocusBrowserPageMutation {
  string browser_provider_id = 1;
  string page_id = 2;
  string current_page_id = 3;
  string takeover_id = 4;
  uint64 generation = 5;
}

