enum ScheduleGeneratedSessionDisposition {
  SCHEDULE_GENERATED_SESSION_DISPOSITION_UNSPECIFIED = 0;
  SCHEDULE_GENERATED_SESSION_DISPOSITION_KEEP = 1;
  SCHEDULE_GENERATED_SESSION_DISPOSITION_ARCHIVE = 2;
  SCHEDULE_GENERATED_SESSION_DISPOSITION_DELETE = 3;
}

