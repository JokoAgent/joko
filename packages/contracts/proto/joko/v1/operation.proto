  string relative_path = 4;
  string old_relative_path = 5;
  // Zero-based index in the exact diff returned with expected_repository_revision.
  uint32 hunk_index = 6;
  string expected_repository_revision = 7;
  bool ignore_whitespace = 8;
  // Required for the destructive REVERT action; ignored for other actions.
  bool confirm_revert = 9;
  // Callers must choose FILE or HUNK explicitly.
  WorkspaceDiffTarget target = 10;
}

message CommitWorkspaceDiffMutation {
  string workspace_id = 1;
  string message = 2;
  string expected_repository_revision = 3;
  // Explicit "include unstaged" choice. When false, only the index is
  // committed. When true, Git stages the current workspace before commit.
  bool include_unstaged = 4;
}

message PushWorkspaceBranchMutation {
  string workspace_id = 1;
  // A configured remote name, never a URL.
  string remote = 2;
  // Fully qualified refs/heads/... destination.
  string remote_ref = 3;
  string expected_repository_revision = 4;
  string expected_head_revision = 5;
  // Set only after a prior NEEDS_FORCE result and explicit user confirmation.
  // Orchestrator permits force-with-lease only; a bare force push is never exposed.
  bool confirm_force_with_lease = 6;
  // Remote OID returned by the prior NEEDS_FORCE result. It is re-read before
  // dispatch and embedded in --force-with-lease=<ref>:<oid>.
  string expected_remote_oid = 7;
}

