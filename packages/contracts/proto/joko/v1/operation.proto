message UpdateVoiceInputServiceSettingsMutation {
  VoiceInputServiceSettingsPatch patch = 1;
}

message AcknowledgeSessionAttentionMutation {
  string session_id = 1;
  EventCursor through_cursor = 2;
  SessionAttentionAcknowledgementIntent intent = 3;
}

enum SessionAttentionAcknowledgementIntent {
  SESSION_ATTENTION_ACKNOWLEDGEMENT_INTENT_UNSPECIFIED = 0;
  // Passive viewing may consume normal done/awaiting attention, never errors.
  SESSION_ATTENTION_ACKNOWLEDGEMENT_INTENT_VIEWED = 1;
  // A deliberate error-tail disposition; only valid for error attention.
  SESSION_ATTENTION_ACKNOWLEDGEMENT_INTENT_EXPLICIT = 2;
}

message RevokeDeviceMutation {
  string device_id = 1;
  string reason = 2;
}

message LogoutConnectionMutation {
  string connection_id = 1;
}

message RestartBackendMutation {
  string backend_id = 1;
}

message CreateTargetMutation {
  string backend_id = 1;
  string display_name = 2;
  TargetWorkspaceInput workspace = 3;
}

message TargetWorkspaceInput {
  WorkspaceKind kind = 1;
  // Interpreted and canonicalized only on the service node.
  string server_path = 2;
  bool create_if_missing = 3;
}

message UpdateTargetMutation {
  string target_id = 1;
  optional string display_name = 2;
  optional bool pinned = 3;
  oneof workspace_location_update {
    RemoteWorkspaceBinding remote_workspace = 4;
    // Must be true. Clears a Remote binding and restores the Target's durable
    // service-node workspace root for subsequently-created Sessions.
    bool service_node_workspace = 5;
  }
}

message RenameDeviceMutation {
  string device_id = 1;
  string display_name = 2;
}

message SetDeviceRemoteControlEnabledMutation {
  bool enabled = 1;
}

message SetDeviceControlTargetEnabledMutation {
  string target_device_id = 1;
  bool enabled = 2;
}

message SetDeviceControllerAllowedMutation {
  string controller_device_id = 1;
  bool allowed = 2;
}

message ArchiveTargetMutation {
  string target_id = 1;
  bool archived = 2;
}

message DeleteTargetMutation {
  string target_id = 1;
  bool delete_managed_workspace = 2;
  bool delete_product_sessions = 3;
}

message CreateSessionMutation {
  string backend_id = 1;
  string target_id = 2;
  string display_name = 3;
  NativeSessionStart native_start = 4;
  ModelSelection model = 5;
  PermissionMode permission_mode = 6;
  bool plan_mode = 7;
  // Private creation-time snapshot appended to fresh Pi system instructions.
  // Orchestrator rejects values longer than 8,000 characters or containing NUL and
  // never projects it through Session snapshots, Events, logs, or diagnostics.
  optional string append_system_prompt = 8;
  // Valid only for a fresh native Session. Orchestrator resolves the Target path;
  // clients never submit an arbitrary working directory.
  bool use_worktree = 9;
  optional string worktree_source_ref = 10;
  bool refresh_worktree_remote = 11;
  // Initial sidebar placement, committed atomically with product task creation.
  NativeSessionPlacement initial_placement = 12;
  // Catalog import presentation is committed with an attached native task so
  // grouping, archive state, and native ordering never require client repairs.
  NativeCatalogImportPresentation catalog_import = 13;
}

message NativeCatalogImportPresentation {
  optional string project_id = 1;
  bool archived = 2;
  google.protobuf.Timestamp modified_at = 3;
  string snapshot_token = 4;
  google.protobuf.Timestamp created_at = 5;
}

message NativeSessionStart {
  oneof kind {
    NewNativeSession new_session = 1;
    AttachNativeSession attach = 2;
    CloneNativeSession clone = 3;
    ForkNativeSession fork = 4;
  }
}

message NewNativeSession {
  string parent_native_reference = 1;
}

message AttachNativeSession {
  string opaque_native_reference = 1;
}

message CloneNativeSession {
  string source_product_session_id = 1;
  optional string source_message_id = 2;
  optional string source_event_id = 3;
}

message ForkNativeSession {
  string source_product_session_id = 1;
  string native_entry_id = 2;
  optional string source_message_id = 3;
  optional string source_event_id = 4;
}

message ResumeSessionMutation {
  string session_id = 1;
}

message DetachSessionMutation {
  string session_id = 1;
}

message CloseSessionMutation {
  string session_id = 1;
}

message RenameSessionMutation {
  string session_id = 1;
  string display_name = 2;
}

message PinSessionMutation {
  string session_id = 1;
  bool pinned = 2;
}

message ArchiveSessionMutation {
  string session_id = 1;
  bool archived = 2;
}

message DeleteSessionMutation {
  string session_id = 1;
  bool delete_native_session = 2;
  bool delete_artifacts = 3;
}

message ForkSessionMutation {
  string source_session_id = 1;
  string native_entry_id = 2;
  string new_display_name = 3;
  optional string source_message_id = 4;
  optional string source_event_id = 5;
}

message CloneSessionMutation {
  string source_session_id = 1;
  string new_display_name = 2;
  optional string source_message_id = 3;
  optional string source_event_id = 4;
}

message NavigateSessionBranchMutation {
  string session_id = 1;
  string native_entry_id = 2;
  bool summarize = 3;
  string custom_instructions = 4;
}

message StartReviewMutation {
  string source_session_id = 1;
  string focus = 2;
  repeated ReviewAttachmentInput attachments = 3;
}

message ReobserveReviewMutation {
  string review_run_id = 1;
}

message CompactSessionMutation {
  string session_id = 1;
  string custom_instructions = 2;
}

message ExportSessionMutation {
  string session_id = 1;
  SessionExportFormat format = 2;
}

enum SessionExportFormat {
  SESSION_EXPORT_FORMAT_UNSPECIFIED = 0;
  SESSION_EXPORT_FORMAT_HTML = 1;
}

message SetSessionModelMutation {
  string session_id = 1;
  ModelSelection model = 2;
}

message SetSessionPermissionMutation {
  string session_id = 1;
  PermissionMode permission_mode = 2;
}

message SetSessionPlanModeMutation {
  string session_id = 1;
  bool enabled = 2;
}

message MoveSessionProjectMutation {
  string session_id = 1;
  // Presence selects a navigation project. Absence moves the task to the
  // projectless dialogue group without changing its immutable Target/runtime.
  optional string project_id = 2;
  NativeCatalogImportPresentation catalog_import = 3;
}

message SendInputMutation {
  string session_id = 1;
  InputContent input = 2;
  QueueDeliveryMode delivery_mode = 3;
  PerTurnOverrides overrides = 4;
}

message PerTurnOverrides {
  optional ModelSelection model = 1;
  optional PermissionMode permission_mode = 2;
  optional bool plan_mode = 3;
  repeated string extra_directory_ids = 4;
}

message AbortRunMutation {
  string run_id = 1;
}

message RetryRunMutation {
  string run_id = 1;
}

message AbortRetryMutation {
  string run_id = 1;
}

message CancelQueueItemMutation {
  string queue_item_id = 1;
}

// Editing is valid only before backend dispatch. The service must reject a
// stale generation/precondition rather than mutating an already accepted
// native queue entry.
message EditQueueItemMutation {
  string queue_item_id = 1;
  InputContent input = 2;
  optional QueueDeliveryMode delivery_mode = 3;
  string lock_token = 4;
}

message ReorderQueueItemMutation {
  string queue_item_id = 1;
  QueuePlacement placement = 2;
  string interaction_lock_token = 3;
}

message QueuePlacement {
  oneof anchor {
    string before_queue_item_id = 1;
    string after_queue_item_id = 2;
    QueueEdge edge = 3;
  }
}

enum QueueEdge {
  QUEUE_EDGE_UNSPECIFIED = 0;
  QUEUE_EDGE_FIRST = 1;
  QUEUE_EDGE_LAST = 2;
}

// Pausing affects future dispatch for one Session queue. It does not abort the
// active Run and does not claim to retract an item already accepted by Pi.
message PauseQueueMutation {
  string session_id = 1;
  string reason = 2;
}

message ResumeQueueMutation {
  string session_id = 1;
}

// Short-lived authority used while a queued input editor is open. The lock is
// durable so a response retry cannot accidentally release dispatch, and it is
// bounded by a service-owned expiry so an abandoned client cannot stall a
// Session queue indefinitely.
message SetQueueItemEditLockMutation {
  string queue_item_id = 1;
  string lock_token = 2;
  bool locked = 3;
}

// Short-lived queue-wide authority used for pointer reordering. While held,
// the service must not claim the next accepted item for Backend dispatch.
message SetQueueInteractionLockMutation {
  string session_id = 1;
  string lock_token = 2;
  bool locked = 3;
}

message ScheduleInput {
  string display_name = 1;
  string backend_id = 2;
  string target_id = 3;
  string session_id = 4;
  ScheduleRecurrence recurrence = 5;
  string time_zone = 6;
  InputContent input = 7;
  ScheduleExecutionSnapshot execution = 8;
  ScheduleOverlapPolicy overlap_policy = 9;
  ScheduleMisfirePolicy misfire_policy = 10;
  bool enabled = 11;
  ScheduleSessionMode session_mode = 12;
}

message CreateScheduleMutation {
  ScheduleInput schedule = 1;
}

message UpdateScheduleMutation {
  string schedule_id = 1;
  ScheduleInput schedule = 2;
}

message DeleteScheduleMutation {
  string schedule_id = 1;
  ScheduleGeneratedSessionDisposition generated_session_disposition = 2;
