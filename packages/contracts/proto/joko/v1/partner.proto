syntax = "proto3";

package joko.v1;

import "google/protobuf/timestamp.proto";
import "joko/v1/capability.proto";
import "joko/v1/common.proto";

enum PartnerLifecycle {
  PARTNER_LIFECYCLE_UNSPECIFIED = 0;
  PARTNER_LIFECYCLE_ACTIVE = 1;
  PARTNER_LIFECYCLE_ARCHIVED = 2;
  PARTNER_LIFECYCLE_DELETED = 3;
  PARTNER_LIFECYCLE_PAUSED = 4;
}

enum PartnerDeletionPhase {
  PARTNER_DELETION_PHASE_UNSPECIFIED = 0;
  PARTNER_DELETION_PHASE_CLOSING = 1;
  PARTNER_DELETION_PHASE_CLEANUP = 2;
  PARTNER_DELETION_PHASE_COMPLETED = 3;
}

enum PartnerRestartPhase {
  PARTNER_RESTART_PHASE_UNSPECIFIED = 0;
  PARTNER_RESTART_PHASE_CLOSING = 1;
  PARTNER_RESTART_PHASE_READY = 2;
}
message PartnerRestart {
  string request_id = 1;
  string partner_id = 2;
  PartnerRestartPhase phase = 3;
  bool runtime_close_pending = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}
message GetPartnerRestartControlsRequest { string partner_id = 1; }
message GetPartnerRestartControlsResponse { Revision revision = 1; bool available = 2; }
message RestartPartnerRequest { string request_id = 1; string partner_id = 2; Revision expected_revision = 3; }
message RestartPartnerResponse { PartnerRestart restart = 1; }
message GetPartnerRestartRequest { string request_id = 1; }
message GetPartnerRestartResponse { PartnerRestart restart = 1; bool retired = 2; }
message RetryPartnerRestartRequest { string request_id = 1; }
message RetryPartnerRestartResponse { PartnerRestart restart = 1; }
message RetirePartnerRestartRequest { string request_id = 1; }
message RetirePartnerRestartResponse { PartnerRestart restart = 1; bool retired = 2; }

enum PartnerDeletionFailure {
  PARTNER_DELETION_FAILURE_UNSPECIFIED = 0;
  PARTNER_DELETION_FAILURE_RUNTIME_CLOSE_PENDING = 1;
  PARTNER_DELETION_FAILURE_HOME_CLEANUP_PENDING = 2;
}

message PartnerDeletion {
  string request_id = 1;
  string partner_id = 2;
  PartnerDeletionPhase phase = 3;
  PartnerDeletionFailure failure = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message DeletePartnerRequest {
  string request_id = 1;
  string partner_id = 2;
  Revision expected_revision = 3;
  string confirm_name = 4;
}

message DeletePartnerResponse {
  PartnerDeletion deletion = 1;
}

message GetPartnerDeletionRequest { string request_id = 1; }
message GetPartnerDeletionResponse {
  PartnerDeletion deletion = 1;
  bool retired = 2;
}
message RetryPartnerDeletionRequest { string request_id = 1; }
message RetryPartnerDeletionResponse { PartnerDeletion deletion = 1; }
message RetirePartnerDeletionRequest { string request_id = 1; }
message RetirePartnerDeletionResponse {
  PartnerDeletion deletion = 1;
  bool retired = 2;
}

enum PartnerInitializationState {
  PARTNER_INITIALIZATION_STATE_UNSPECIFIED = 0;
  PARTNER_INITIALIZATION_STATE_PENDING = 1;
  PARTNER_INITIALIZATION_STATE_READY = 2;
  PARTNER_INITIALIZATION_STATE_ERROR = 3;
}

enum PartnerInitializationErrorCode {
  PARTNER_INITIALIZATION_ERROR_CODE_UNSPECIFIED = 0;
  PARTNER_INITIALIZATION_ERROR_CODE_HOME_UNAVAILABLE = 1;
  PARTNER_INITIALIZATION_ERROR_CODE_MODEL_UNAVAILABLE = 2;
  PARTNER_INITIALIZATION_ERROR_CODE_SESSION_UNAVAILABLE = 3;
  PARTNER_INITIALIZATION_ERROR_CODE_STATE_CHANGED = 4;
  PARTNER_INITIALIZATION_ERROR_CODE_AVATAR_UNAVAILABLE = 5;
}

enum PartnerInvitationStage {
  PARTNER_INVITATION_STAGE_UNSPECIFIED = 0;
  PARTNER_INVITATION_STAGE_HOME = 1;
  PARTNER_INVITATION_STAGE_AVATAR = 2;
  PARTNER_INVITATION_STAGE_SESSION = 3;
  PARTNER_INVITATION_STAGE_READY = 4;
  PARTNER_INVITATION_STAGE_FAILED = 5;
}

enum PartnerSessionRole {
  PARTNER_SESSION_ROLE_UNSPECIFIED = 0;
  PARTNER_SESSION_ROLE_CANONICAL = 1;
  PARTNER_SESSION_ROLE_HISTORY = 2;
  PARTNER_SESSION_ROLE_DELEGATION = 3;
  PARTNER_SESSION_ROLE_TOPIC = 4;
}

enum PartnerWorkingPhase {
  PARTNER_WORKING_PHASE_UNSPECIFIED = 0;
  PARTNER_WORKING_PHASE_THINKING = 1;
  PARTNER_WORKING_PHASE_REPLYING = 2;
  PARTNER_WORKING_PHASE_PROCESSING = 3;
  PARTNER_WORKING_PHASE_COMPACTING = 4;
  PARTNER_WORKING_PHASE_READING_MEMORY = 5;
  PARTNER_WORKING_PHASE_SAVING_MEMORY = 6;
  PARTNER_WORKING_PHASE_DELETING_MEMORY = 7;
  PARTNER_WORKING_PHASE_ORGANIZING_MEMORY = 8;
  PARTNER_WORKING_PHASE_READING_FILE = 9;
  PARTNER_WORKING_PHASE_SAVING_FILE = 10;
  PARTNER_WORKING_PHASE_SEARCHING = 11;
  PARTNER_WORKING_PHASE_READING_WEB = 12;
  PARTNER_WORKING_PHASE_SEARCHING_FILES = 13;
  PARTNER_WORKING_PHASE_TESTING = 14;
  PARTNER_WORKING_PHASE_CHECKING = 15;
  PARTNER_WORKING_PHASE_REVIEWING_MEMORY = 16;
  PARTNER_WORKING_PHASE_REVIEWING_FILES = 17;
  PARTNER_WORKING_PHASE_REVIEWING_SOURCES = 18;
  PARTNER_WORKING_PHASE_REVIEWING_CHECKS = 19;
  PARTNER_WORKING_PHASE_RECONNECTING = 20;
  PARTNER_WORKING_PHASE_MODEL_BUSY = 21;
  PARTNER_WORKING_PHASE_RATE_LIMIT = 22;
}

enum PartnerPrivateThreadStatus {
  PARTNER_PRIVATE_THREAD_STATUS_UNSPECIFIED = 0;
  PARTNER_PRIVATE_THREAD_STATUS_ACTIVE = 1;
  PARTNER_PRIVATE_THREAD_STATUS_CLOSED = 2;
}

enum PartnerPrivateThreadCloseReason {
  PARTNER_PRIVATE_THREAD_CLOSE_REASON_UNSPECIFIED = 0;
  PARTNER_PRIVATE_THREAD_CLOSE_REASON_MESSAGE_LIMIT = 1;
  PARTNER_PRIVATE_THREAD_CLOSE_REASON_IDLE_TIMEOUT = 2;
}

enum PartnerPrivateMessageDeliveryStatus {
  PARTNER_PRIVATE_MESSAGE_DELIVERY_STATUS_UNSPECIFIED = 0;
  PARTNER_PRIVATE_MESSAGE_DELIVERY_STATUS_PENDING = 1;
  PARTNER_PRIVATE_MESSAGE_DELIVERY_STATUS_DELIVERED = 2;
  PARTNER_PRIVATE_MESSAGE_DELIVERY_STATUS_FAILED = 3;
}

enum PartnerDelegationStatus {
  PARTNER_DELEGATION_STATUS_UNSPECIFIED = 0;
  PARTNER_DELEGATION_STATUS_PREPARING = 1;
  PARTNER_DELEGATION_STATUS_QUEUED = 2;
  PARTNER_DELEGATION_STATUS_RUNNING = 3;
  PARTNER_DELEGATION_STATUS_WAITING = 4;
  PARTNER_DELEGATION_STATUS_COMPLETED = 5;
  PARTNER_DELEGATION_STATUS_FAILED = 6;
  PARTNER_DELEGATION_STATUS_CANCELLED = 7;
  PARTNER_DELEGATION_STATUS_UNKNOWN = 8;
}

message PartnerModelRoute {
  string backend_id = 1;
  string provider_id = 2;
  string model_id = 3;
  optional string effort = 4;
  bool fast_mode = 5;
  bool ultrafast_mode = 6;
}

message PartnerModelChain {
  repeated PartnerModelRoute routes = 1;
}

message PartnerCapabilities {
  repeated PartnerModelRoute model_chain = 1;
  PermissionMode permission_mode = 2;
  bool plan_mode = 3;
  // Omitted means enabled. This is independent of the model's tool selection.
  optional bool input_handoff = 4;
}

message PartnerTemplate {
  string template_id = 1;
  string display_name = 2;
  string description = 3;
  string identity_source = 4;
}

message PartnerAvatarImage {
  string sha256 = 1;
  string mime_type = 2;
  uint64 byte_length = 3;
}

message PartnerAvatar {
  oneof value {
    string preset_id = 1;
    PartnerAvatarImage image = 2;
  }
}

message PartnerAvatarInput {
  oneof value {
    string preset_id = 1;
    string image_base64 = 2;
  }
}

message PartnerProfile {
  string partner_id = 1;
  Revision revision = 2;
  uint64 profile_version = 3;
  string display_name = 4;
  PartnerAvatar avatar = 5;
  string identity_source = 6;
  string template_id = 7;
  PartnerLifecycle lifecycle = 8;
  PartnerInitializationState initialization_state = 9;
  PartnerInvitationStage invitation_stage = 10;
  optional PartnerInitializationErrorCode initialization_error_code = 11;
  string home_target_id = 12;
  optional string canonical_session_id = 13;
  PartnerCapabilities capabilities = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  bool uses_directory_defaults = 17;
  PartnerActivity activity = 18;
  optional bool pause_cleanup_pending = 19;
  optional PartnerModelRoute task_model_override = 20;
  string description = 21;
}

message PartnerActivity {
  string partner_id = 1;
  uint64 unread_reply_count = 2;
  optional Revision latest_reply_cursor = 3;
  optional google.protobuf.Timestamp latest_reply_at = 4;
  uint64 artifact_count = 5;
  uint64 active_delegation_count = 6;
  Revision read_through_cursor = 7;
  google.protobuf.Timestamp read_updated_at = 8;
  // At most 500 characters from the latest completed public assistant reply.
  // Empty when that reply has no text. Private messages and reasoning are excluded.
  string latest_reply_preview = 9;
  PartnerWorkingStatus working_status = 10;
}

// Public execution facts scoped to the current canonical task incarnation.
message PartnerWorkingStatus {
  string session_id = 1;
  string target_id = 2;
  string backend_id = 3;
  uint64 generation = 4;
  string run_id = 5;
  string attempt_id = 6;
  PartnerWorkingPhase phase = 7;
  // Optional, validated activity caption. Never task content or tool output.
  string caption = 8;
}

message ReadPartnerWorkingStatusRequest {
  string partner_id = 1;
  string session_id = 2;
  uint64 generation = 3;
  string run_id = 4;
  string attempt_id = 5;
  PartnerWorkingPhase phase = 6;
  string locale = 7;
}

message ReadPartnerWorkingStatusResponse {
  PartnerWorkingStatus working_status = 1;
}

message PartnerSession {
  string session_id = 1;
  string partner_id = 2;
  PartnerSessionRole role = 3;
  uint64 profile_version = 4;
  optional string parent_session_id = 5;
  optional string delegation_id = 6;
  string display_name = 7;
  bool available = 8;
  bool read_only = 9;
  bool archived = 10;
  bool deleted = 11;
  google.protobuf.Timestamp created_at = 12;
  optional google.protobuf.Timestamp last_activity_at = 13;
  PartnerTopicRoot topic_root = 14;
}

message PartnerTopicRoot {
  string session_id = 1;
  uint64 generation = 2;
  string event_id = 3;
  string message_id = 4;
}

message EnsurePartnerTopicRequest {
  string operation_id = 1;
  string partner_id = 2;
  PartnerTopicRoot root = 3;
  Revision expected_partner_revision = 4;
}
message EnsurePartnerTopicResponse { PartnerSession topic = 1; }
message GetPartnerTopicRequest { string session_id = 1; }
message GetPartnerTopicResponse { PartnerSession topic = 1; }

message PartnerPrivateThread {
  string thread_id = 1;
  string first_partner_id = 2;
  string second_partner_id = 3;
  PartnerPrivateThreadStatus status = 4;
  optional PartnerPrivateThreadCloseReason close_reason = 5;
  uint32 message_count = 6;
  uint32 max_messages = 7;
  google.protobuf.Timestamp expires_at = 8;
  optional google.protobuf.Timestamp blocked_until = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  optional google.protobuf.Timestamp closed_at = 12;
}

message PartnerPrivateMessage {
  string message_id = 1;
  string thread_id = 2;
  uint64 sequence = 3;
  string sender_partner_id = 4;
  string recipient_partner_id = 5;
  string content = 6;
  PartnerPrivateMessageDeliveryStatus delivery_status = 7;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp delivered_at = 9;
}

message PartnerPrivateThreadReadState {
  string thread_id = 1;
  string partner_id = 2;
  uint64 through_sequence = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message PartnerDelegation {
  string delegation_id = 1;
  Revision revision = 2;
  string requester_partner_id = 3;
  string target_partner_id = 4;
  string parent_session_id = 5;
  uint64 target_profile_version = 6;
  string title = 7;
  string objective = 8;
  PartnerDelegationStatus status = 9;
  optional string child_session_id = 10;
  optional string run_id = 11;
  optional string result_summary = 12;
  optional string error = 13;
  uint64 artifact_count = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  optional google.protobuf.Timestamp started_at = 17;
  optional google.protobuf.Timestamp completed_at = 18;
}

message PartnerDirectory {
  Revision revision = 1;
  uint32 active_count = 2;
  uint32 archived_count = 3;
  uint32 error_count = 4;
  google.protobuf.Timestamp updated_at = 5;
  repeated PartnerTemplate templates = 6;
  repeated string avatar_presets = 7;
  optional PartnerCapabilities default_capabilities = 8;
}

message PartnerDraft {
  string display_name = 1;
  PartnerAvatarInput avatar = 2;
  string identity_source = 3;
  string template_id = 4;
  PartnerCapabilities capabilities = 5;
  bool uses_directory_defaults = 6;
  string description = 7;
}

message PartnerPatch {
  optional string display_name = 1;
  PartnerAvatarInput avatar = 2;
  optional string identity_source = 3;
  optional PartnerModelChain model_chain = 4;
  optional PermissionMode permission_mode = 5;
  optional bool plan_mode = 6;
  optional bool uses_directory_defaults = 7;
  oneof task_model_preference {
    PartnerModelRoute task_model_override = 8;
    bool inherit_task_model = 9;
  }
  optional string description = 10;
  optional bool input_handoff = 11;
}

message GetPartnerDirectoryRequest {}

message GetPartnerDirectoryResponse {
  PartnerDirectory directory = 1;
}

message ListPartnersRequest {
  optional PartnerLifecycle lifecycle = 1;
}

message ListPartnersResponse {
  repeated PartnerProfile partners = 1;
  PartnerDirectory directory = 2;
  repeated PartnerDeletion pending_deletions = 3;
  repeated PartnerRestart pending_restarts = 4;
}

message GetPartnerRequest {
  string partner_id = 1;
}

message GetPartnerResponse {
  PartnerProfile partner = 1;
}

message ReadPartnerAvatarRequest {
  string partner_id = 1;
  Revision expected_revision = 2;
  string sha256 = 3;
}

message ReadPartnerAvatarResponse {
  PartnerAvatarImage image = 1;
  bytes content = 2;
}

message CreatePartnerRequest {
  Revision expected_directory_revision = 1;
  PartnerDraft draft = 2;
  string request_id = 3;
}

message CreatePartnerResponse {
  PartnerProfile partner = 1;
  PartnerDirectory directory = 2;
}

message GetPartnerCreationRequest {
  string request_id = 1;
}

message GetPartnerCreationResponse {
  PartnerProfile partner = 1;
  PartnerDirectory directory = 2;
}

message RetirePartnerCreationRequest {
  string request_id = 1;
}

message RetirePartnerCreationResponse {
  bool retired = 1;
  PartnerProfile partner = 2;
  PartnerDirectory directory = 3;
}

message UpdatePartnerRequest {
  string partner_id = 1;
  Revision expected_revision = 2;
  PartnerPatch patch = 3;
}

message UpdatePartnerResponse {
  PartnerProfile partner = 1;
  PartnerDirectory directory = 2;
}

message SetPartnerLifecycleRequest {
  string partner_id = 1;
  Revision expected_revision = 2;
  PartnerLifecycle lifecycle = 3;
}

message SetPartnerLifecycleResponse {
  PartnerProfile partner = 1;
  PartnerDirectory directory = 2;
}

message RetryPartnerInitializationRequest {
  string partner_id = 1;
  Revision expected_revision = 2;
}

message RetryPartnerInitializationResponse {
  PartnerProfile partner = 1;
  PartnerDirectory directory = 2;
}

message UpdatePartnerDefaultsRequest {
  Revision expected_directory_revision = 1;
  PartnerCapabilities capabilities = 2;
}

message UpdatePartnerDefaultsResponse {
  PartnerDirectory directory = 1;
  repeated PartnerProfile affected_partners = 2;
}

message ListPartnerSessionsRequest {
  string partner_id = 1;
}

message ListPartnerSessionsResponse {
  repeated PartnerSession sessions = 1;
  repeated PartnerSessionTask tasks = 2;
}

enum PartnerTaskOutputSourceKind {
  PARTNER_TASK_OUTPUT_SOURCE_KIND_UNSPECIFIED = 0;
  PARTNER_TASK_OUTPUT_SOURCE_KIND_SESSION_TASK = 1;
  PARTNER_TASK_OUTPUT_SOURCE_KIND_DELEGATION = 2;
}

enum PartnerTaskOutputReadiness {
  PARTNER_TASK_OUTPUT_READINESS_UNSPECIFIED = 0;
  PARTNER_TASK_OUTPUT_READINESS_PENDING = 1;
  PARTNER_TASK_OUTPUT_READINESS_READY = 2;
  PARTNER_TASK_OUTPUT_READINESS_UNAVAILABLE = 3;
}

enum PartnerTaskOutputFileStatus {
  PARTNER_TASK_OUTPUT_FILE_STATUS_UNSPECIFIED = 0;
  PARTNER_TASK_OUTPUT_FILE_STATUS_ADDED = 1;
  PARTNER_TASK_OUTPUT_FILE_STATUS_MODIFIED = 2;
  PARTNER_TASK_OUTPUT_FILE_STATUS_RENAMED = 3;
}

message PartnerTaskOutputFile {
  string path = 1;
  PartnerTaskOutputFileStatus status = 2;
}

// Display metadata from the source execution's sealed accepted Runs, never file contents.
message PartnerTaskOutput {
  PartnerTaskOutputSourceKind source_kind = 1;
  string source_id = 2;
  string parent_session_id = 3;
  string session_id = 4;
  uint64 execution = 5;
  repeated string run_ids = 6;
  Revision source_revision = 7;
  string title = 8;
  PartnerTaskOutputReadiness readiness = 9;
  repeated PartnerTaskOutputFile files = 10;
  bool truncated = 11;
}

message ListPartnerTaskOutputsRequest { string partner_id = 1; }
message ListPartnerTaskOutputsResponse {
  string partner_id = 1;
  repeated PartnerTaskOutput outputs = 2;
  bool truncated = 3;
}

enum PartnerSessionTaskStatus {
  PARTNER_SESSION_TASK_STATUS_UNSPECIFIED = 0;
  PARTNER_SESSION_TASK_STATUS_PREPARING = 1;
  PARTNER_SESSION_TASK_STATUS_QUEUED = 2;
  PARTNER_SESSION_TASK_STATUS_RUNNING = 3;
  PARTNER_SESSION_TASK_STATUS_WAITING = 4;
  PARTNER_SESSION_TASK_STATUS_COMPLETED = 5;
  PARTNER_SESSION_TASK_STATUS_FAILED = 6;
  PARTNER_SESSION_TASK_STATUS_CANCELLED = 7;
  PARTNER_SESSION_TASK_STATUS_TIMED_OUT = 8;
  PARTNER_SESSION_TASK_STATUS_UNKNOWN = 9;
}
enum PartnerSessionTaskControl {
  PARTNER_SESSION_TASK_CONTROL_UNSPECIFIED = 0;
  PARTNER_SESSION_TASK_CONTROL_ACTIVE = 1;
  PARTNER_SESSION_TASK_CONTROL_PAUSING = 2;
  PARTNER_SESSION_TASK_CONTROL_PAUSED = 3;
  PARTNER_SESSION_TASK_CONTROL_CANCELLING = 4;
}
message PartnerSessionTask {
  string id = 1;
  string partner_id = 2;
  string session_id = 3;
  string title = 4;
  PartnerSessionTaskStatus status = 5;
  PartnerSessionTaskControl control = 6;
  Revision revision = 7;
  google.protobuf.Timestamp deadline_at = 8;
  string result = 9;
  string error = 10;
}
enum PartnerSessionTaskAction {
  PARTNER_SESSION_TASK_ACTION_UNSPECIFIED = 0;
  PARTNER_SESSION_TASK_ACTION_PAUSE = 1;
  PARTNER_SESSION_TASK_ACTION_RESUME = 2;
  PARTNER_SESSION_TASK_ACTION_CANCEL = 3;
}
message ControlPartnerSessionTaskRequest {
  string request_id = 1;
  string partner_id = 2;
  string task_id = 3;
  Revision expected_partner_revision = 4;
  Revision expected_task_revision = 5;
  PartnerSessionTaskAction action = 6;
}
message ControlPartnerSessionTaskResponse { PartnerSessionTask task = 1; }

message MarkPartnerReadRequest {
  string partner_id = 1;
  Revision through_cursor = 2;
}

message MarkPartnerReadResponse {
  PartnerActivity activity = 1;
}

message ListPartnerPrivateThreadsRequest {
  string partner_id = 1;
}

message ListPartnerPrivateThreadsResponse {
  repeated PartnerPrivateThread threads = 1;
}

message GetPartnerPrivateThreadRequest {
  string partner_id = 1;
  string thread_id = 2;
}

message GetPartnerPrivateThreadResponse {
  PartnerPrivateThread thread = 1;
  repeated PartnerPrivateMessage messages = 2;
  optional PartnerPrivateThreadReadState read_state = 3;
}

message MarkPartnerPrivateThreadReadRequest {
  string partner_id = 1;
  string thread_id = 2;
  uint64 through_sequence = 3;
}

message MarkPartnerPrivateThreadReadResponse {
  PartnerPrivateThreadReadState read_state = 1;
}

message ListPartnerDelegationsRequest {
  string partner_id = 1;
}

message ListPartnerDelegationsResponse {
  repeated PartnerDelegation delegations = 1;
}

message GetPartnerDelegationRequest {
  string partner_id = 1;
  string delegation_id = 2;
}

message GetPartnerDelegationResponse {
  PartnerDelegation delegation = 1;
}

message CancelPartnerDelegationRequest {
  string partner_id = 1;
  string delegation_id = 2;
  Revision expected_revision = 3;
}

message CancelPartnerDelegationResponse {
  PartnerDelegation delegation = 1;
}

enum PartnerMemoryKind {
  PARTNER_MEMORY_KIND_UNSPECIFIED = 0;
  PARTNER_MEMORY_KIND_USER = 1;
  PARTNER_MEMORY_KIND_FEEDBACK = 2;
  PARTNER_MEMORY_KIND_PROJECT = 3;
  PARTNER_MEMORY_KIND_REFERENCE = 4;
}

message PartnerMemoryOwner {
  string partner_id = 1;
  string home_target_id = 2;
  string canonical_session_id = 3;
  Revision revision = 4;
  bool read_only = 5;
  optional bool memory_enabled = 6;
}

message PartnerMemorySummary {
  string entry_id = 1;
  PartnerMemoryKind kind = 2;
  string title = 3;
  string preview = 4;
  google.protobuf.Timestamp updated_at = 5;
  Revision revision = 6;
}

message PartnerMemoryEntry {
  PartnerMemorySummary summary = 1;
  string body = 2;
}

message PartnerMemoryGroup {
  PartnerMemoryKind kind = 1;
  uint32 count = 2;
  repeated PartnerMemorySummary entries = 3;
}

message ListPartnerMemoriesRequest { string partner_id = 1; string query = 2; }
message ListPartnerMemoriesResponse {
  PartnerMemoryOwner owner = 1;
  repeated PartnerMemoryGroup groups = 2;
  bool truncated = 3;
}
message ReadPartnerMemoryRequest { string partner_id = 1; string entry_id = 2; }
message ReadPartnerMemoryResponse { PartnerMemoryOwner owner = 1; PartnerMemoryEntry entry = 2; }
message UpdatePartnerMemoryRequest {
  string partner_id = 1;
  string entry_id = 2;
  Revision expected_partner_revision = 3;
  Revision expected_revision = 4;
  string title = 5;
  string body = 6;
}
message UpdatePartnerMemoryResponse { PartnerMemoryOwner owner = 1; PartnerMemoryEntry entry = 2; }
message DeletePartnerMemoryRequest {
  string partner_id = 1;
  string entry_id = 2;
  Revision expected_partner_revision = 3;
  Revision expected_revision = 4;
}
message DeletePartnerMemoryResponse { PartnerMemoryOwner owner = 1; string entry_id = 2; }

message PartnerMemoryPreferences {
  PartnerMemoryOwner owner = 1;
  bool enabled = 2;
  string user_context = 3;
  Revision revision = 4;
}
message GetPartnerMemoryPreferencesRequest { string partner_id = 1; }
message GetPartnerMemoryPreferencesResponse { PartnerMemoryPreferences preferences = 1; }
message UpdatePartnerMemoryPreferencesRequest {
  string partner_id = 1;
  Revision expected_partner_revision = 2;
  Revision expected_revision = 3;
  optional bool enabled = 4;
  optional string user_context = 5;
}
message UpdatePartnerMemoryPreferencesResponse { PartnerMemoryPreferences preferences = 1; }

enum PartnerConnectionKind {
  PARTNER_CONNECTION_KIND_UNSPECIFIED = 0;
  PARTNER_CONNECTION_KIND_MCP = 1;
  PARTNER_CONNECTION_KIND_TOOLSET = 2;
  PARTNER_CONNECTION_KIND_SKILL = 3;
}
enum PartnerConnectionMode {
  PARTNER_CONNECTION_MODE_UNSPECIFIED = 0;
  PARTNER_CONNECTION_MODE_INHERIT = 1;
  PARTNER_CONNECTION_MODE_ALLOWLIST = 2;
}
message PartnerConnectionSelection {
  PartnerConnectionMode mode = 1;
  repeated string ids = 2;
}
message PartnerConnectionEntry {
  PartnerConnectionKind kind = 1;
  string id = 2;
  string name = 3;
  bool available = 4;
  bool inherited = 5;
  bool personal = 6;
  string description = 7;
}
message PartnerConnectionsOwner {
  string partner_id = 1;
  string home_target_id = 2;
  string canonical_session_id = 3;
  Revision revision = 4;
  bool read_only = 5;
}
message PartnerConnections {
  PartnerConnectionsOwner owner = 1;
  optional Revision revision = 2;
  string catalog_revision = 3;
  repeated PartnerConnectionEntry entries = 4;
  PartnerConnectionSelection mcp = 5;
  PartnerConnectionSelection toolsets = 6;
  PartnerConnectionSelection skills = 7;
}
message GetPartnerConnectionsRequest { string partner_id = 1; }
message GetPartnerConnectionsResponse { PartnerConnections connections = 1; }
message UpdatePartnerConnectionsRequest {
  string partner_id = 1;
  Revision expected_partner_revision = 2;
  optional Revision expected_revision = 3;
  string expected_catalog_revision = 4;
  PartnerConnectionSelection mcp = 5;
  PartnerConnectionSelection toolsets = 6;
  PartnerConnectionSelection skills = 7;
}
message UpdatePartnerConnectionsResponse { PartnerConnections connections = 1; }

message PartnerSkillsOwner {
  string partner_id = 1;
  string home_target_id = 2;
  string canonical_session_id = 3;
  Revision revision = 4;
  bool read_only = 5;
}
message PartnerSkillSummary {
  string id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  string updated_at = 5;
  bool enabled = 6;
  Revision revision = 7;
  string content_revision = 8;
}
message PartnerSkill {
  PartnerSkillSummary summary = 1;
  string body = 2;
  bool read_only = 3;
  uint64 body_bytes = 4;
}
message ListPartnerSkillsRequest {
  string partner_id = 1;
  string query = 2;
  uint32 offset = 3;
  uint32 limit = 4;
}
message ListPartnerSkillsResponse {
  PartnerSkillsOwner owner = 1;
  repeated PartnerSkillSummary skills = 2;
  optional uint32 next_offset = 3;
  uint32 total = 4;
}
message ReadPartnerSkillRequest { string partner_id = 1; string skill_id = 2; }
message ReadPartnerSkillResponse { PartnerSkillsOwner owner = 1; PartnerSkill skill = 2; }
message UpdatePartnerSkillRequest {
  string partner_id = 1;
  string skill_id = 2;
  Revision expected_partner_revision = 3;
  Revision expected_revision = 4;
  string expected_content_revision = 5;
  string name = 6;
  string description = 7;
  string body = 8;
}
message UpdatePartnerSkillResponse { PartnerSkillsOwner owner = 1; PartnerSkill skill = 2; }
message DeletePartnerSkillRequest {
  string partner_id = 1;
  string skill_id = 2;
  Revision expected_partner_revision = 3;
