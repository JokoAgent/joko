syntax = "proto3";

package joko.v1;

import "google/protobuf/timestamp.proto";
import "joko/v1/capability.proto";
import "joko/v1/common.proto";

enum PartnerLifecycle {
  PARTNER_LIFECYCLE_UNSPECIFIED = 0;
  PARTNER_LIFECYCLE_ACTIVE = 1;
  PARTNER_LIFECYCLE_ARCHIVED = 2;
  PARTNER_LIFECYCLE_DELETED = 3;
}

enum PartnerInitializationState {
  PARTNER_INITIALIZATION_STATE_UNSPECIFIED = 0;
  PARTNER_INITIALIZATION_STATE_PENDING = 1;
  PARTNER_INITIALIZATION_STATE_READY = 2;
  PARTNER_INITIALIZATION_STATE_ERROR = 3;
}

enum PartnerInitializationErrorCode {
  PARTNER_INITIALIZATION_ERROR_CODE_UNSPECIFIED = 0;
  PARTNER_INITIALIZATION_ERROR_CODE_HOME_UNAVAILABLE = 1;
  PARTNER_INITIALIZATION_ERROR_CODE_MODEL_UNAVAILABLE = 2;
  PARTNER_INITIALIZATION_ERROR_CODE_SESSION_UNAVAILABLE = 3;
  PARTNER_INITIALIZATION_ERROR_CODE_STATE_CHANGED = 4;
  PARTNER_INITIALIZATION_ERROR_CODE_AVATAR_UNAVAILABLE = 5;
}

enum PartnerInvitationStage {
  PARTNER_INVITATION_STAGE_UNSPECIFIED = 0;
  PARTNER_INVITATION_STAGE_HOME = 1;
  PARTNER_INVITATION_STAGE_AVATAR = 2;
  PARTNER_INVITATION_STAGE_SESSION = 3;
  PARTNER_INVITATION_STAGE_READY = 4;
  PARTNER_INVITATION_STAGE_FAILED = 5;
}

enum PartnerSessionRole {
  PARTNER_SESSION_ROLE_UNSPECIFIED = 0;
  PARTNER_SESSION_ROLE_CANONICAL = 1;
  PARTNER_SESSION_ROLE_HISTORY = 2;
  PARTNER_SESSION_ROLE_DELEGATION = 3;
}

enum PartnerPrivateThreadStatus {
  PARTNER_PRIVATE_THREAD_STATUS_UNSPECIFIED = 0;
  PARTNER_PRIVATE_THREAD_STATUS_ACTIVE = 1;
  PARTNER_PRIVATE_THREAD_STATUS_CLOSED = 2;
}

enum PartnerPrivateThreadCloseReason {
  PARTNER_PRIVATE_THREAD_CLOSE_REASON_UNSPECIFIED = 0;
  PARTNER_PRIVATE_THREAD_CLOSE_REASON_MESSAGE_LIMIT = 1;
  PARTNER_PRIVATE_THREAD_CLOSE_REASON_IDLE_TIMEOUT = 2;
}

enum PartnerPrivateMessageDeliveryStatus {
  PARTNER_PRIVATE_MESSAGE_DELIVERY_STATUS_UNSPECIFIED = 0;
  PARTNER_PRIVATE_MESSAGE_DELIVERY_STATUS_PENDING = 1;
  PARTNER_PRIVATE_MESSAGE_DELIVERY_STATUS_DELIVERED = 2;
  PARTNER_PRIVATE_MESSAGE_DELIVERY_STATUS_FAILED = 3;
}

enum PartnerDelegationStatus {
  PARTNER_DELEGATION_STATUS_UNSPECIFIED = 0;
  PARTNER_DELEGATION_STATUS_PREPARING = 1;
  PARTNER_DELEGATION_STATUS_QUEUED = 2;
  PARTNER_DELEGATION_STATUS_RUNNING = 3;
  PARTNER_DELEGATION_STATUS_WAITING = 4;
  PARTNER_DELEGATION_STATUS_COMPLETED = 5;
  PARTNER_DELEGATION_STATUS_FAILED = 6;
  PARTNER_DELEGATION_STATUS_CANCELLED = 7;
  PARTNER_DELEGATION_STATUS_UNKNOWN = 8;
}

message PartnerModelRoute {
  string backend_id = 1;
  string provider_id = 2;
  string model_id = 3;
  optional string effort = 4;
  bool fast_mode = 5;
}

message PartnerModelChain {
  repeated PartnerModelRoute routes = 1;
}

message PartnerCapabilities {
  repeated PartnerModelRoute model_chain = 1;
  PermissionMode permission_mode = 2;
  bool plan_mode = 3;
}

message PartnerTemplate {
  string template_id = 1;
  string display_name = 2;
  string description = 3;
  string identity_source = 4;
}

message PartnerProfile {
  string partner_id = 1;
  Revision revision = 2;
  uint64 profile_version = 3;
  string display_name = 4;
  string avatar = 5;
  string identity_source = 6;
  string template_id = 7;
  PartnerLifecycle lifecycle = 8;
  PartnerInitializationState initialization_state = 9;
  PartnerInvitationStage invitation_stage = 10;
  optional PartnerInitializationErrorCode initialization_error_code = 11;
  string home_target_id = 12;
  optional string canonical_session_id = 13;
  PartnerCapabilities capabilities = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  bool uses_directory_defaults = 17;
  PartnerActivity activity = 18;
}

message PartnerActivity {
  string partner_id = 1;
  uint64 unread_reply_count = 2;
  optional Revision latest_reply_cursor = 3;
  optional google.protobuf.Timestamp latest_reply_at = 4;
  uint64 artifact_count = 5;
  uint64 active_delegation_count = 6;
  Revision read_through_cursor = 7;
  google.protobuf.Timestamp read_updated_at = 8;
}

message PartnerSession {
  string session_id = 1;
  string partner_id = 2;
  PartnerSessionRole role = 3;
  uint64 profile_version = 4;
  optional string parent_session_id = 5;
  optional string delegation_id = 6;
  string display_name = 7;
  bool available = 8;
  bool read_only = 9;
  bool archived = 10;
  bool deleted = 11;
  google.protobuf.Timestamp created_at = 12;
  optional google.protobuf.Timestamp last_activity_at = 13;
}

message PartnerPrivateThread {
  string thread_id = 1;
  string first_partner_id = 2;
  string second_partner_id = 3;
  PartnerPrivateThreadStatus status = 4;
  optional PartnerPrivateThreadCloseReason close_reason = 5;
  uint32 message_count = 6;
  uint32 max_messages = 7;
  google.protobuf.Timestamp expires_at = 8;
  optional google.protobuf.Timestamp blocked_until = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  optional google.protobuf.Timestamp closed_at = 12;
}

message PartnerPrivateMessage {
  string message_id = 1;
  string thread_id = 2;
  uint64 sequence = 3;
  string sender_partner_id = 4;
  string recipient_partner_id = 5;
  string content = 6;
  PartnerPrivateMessageDeliveryStatus delivery_status = 7;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp delivered_at = 9;
}

message PartnerPrivateThreadReadState {
  string thread_id = 1;
  string partner_id = 2;
  uint64 through_sequence = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message PartnerDelegation {
  string delegation_id = 1;
  Revision revision = 2;
  string requester_partner_id = 3;
  string target_partner_id = 4;
  string parent_session_id = 5;
  uint64 target_profile_version = 6;
  string title = 7;
  string objective = 8;
  PartnerDelegationStatus status = 9;
  optional string child_session_id = 10;
  optional string run_id = 11;
  optional string result_summary = 12;
  optional string error = 13;
  uint64 artifact_count = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  optional google.protobuf.Timestamp started_at = 17;
  optional google.protobuf.Timestamp completed_at = 18;
}

message PartnerDirectory {
  Revision revision = 1;
  uint32 active_count = 2;
  uint32 archived_count = 3;
  uint32 error_count = 4;
  google.protobuf.Timestamp updated_at = 5;
  repeated PartnerTemplate templates = 6;
  repeated string avatar_presets = 7;
  optional PartnerCapabilities default_capabilities = 8;
}

message PartnerDraft {
  string display_name = 1;
  string avatar = 2;
  string identity_source = 3;
  string template_id = 4;
  PartnerCapabilities capabilities = 5;
  bool uses_directory_defaults = 6;
}

message PartnerPatch {
  optional string display_name = 1;
  optional string avatar = 2;
  optional string identity_source = 3;
  optional PartnerModelChain model_chain = 4;
  optional PermissionMode permission_mode = 5;
  optional bool plan_mode = 6;
  optional bool uses_directory_defaults = 7;
}

message GetPartnerDirectoryRequest {}

message GetPartnerDirectoryResponse {
  PartnerDirectory directory = 1;
}

message ListPartnersRequest {
  optional PartnerLifecycle lifecycle = 1;
}

message ListPartnersResponse {
  repeated PartnerProfile partners = 1;
  PartnerDirectory directory = 2;
}

message GetPartnerRequest {
  string partner_id = 1;
}

message GetPartnerResponse {
  PartnerProfile partner = 1;
}

message CreatePartnerRequest {
  Revision expected_directory_revision = 1;
  PartnerDraft draft = 2;
}

message CreatePartnerResponse {
  PartnerProfile partner = 1;
  PartnerDirectory directory = 2;
}

message UpdatePartnerRequest {
  string partner_id = 1;
  Revision expected_revision = 2;
  PartnerPatch patch = 3;
}

message UpdatePartnerResponse {
  PartnerProfile partner = 1;
  PartnerDirectory directory = 2;
}

message SetPartnerLifecycleRequest {
  string partner_id = 1;
  Revision expected_revision = 2;
  PartnerLifecycle lifecycle = 3;
}

message SetPartnerLifecycleResponse {
  PartnerProfile partner = 1;
  PartnerDirectory directory = 2;
}

message RetryPartnerInitializationRequest {
  string partner_id = 1;
  Revision expected_revision = 2;
}

message RetryPartnerInitializationResponse {
  PartnerProfile partner = 1;
  PartnerDirectory directory = 2;
}

message UpdatePartnerDefaultsRequest {
  Revision expected_directory_revision = 1;
  PartnerCapabilities capabilities = 2;
}

message UpdatePartnerDefaultsResponse {
  PartnerDirectory directory = 1;
  repeated PartnerProfile affected_partners = 2;
}

message ListPartnerSessionsRequest {
  string partner_id = 1;
}

message ListPartnerSessionsResponse {
  repeated PartnerSession sessions = 1;
}

message MarkPartnerReadRequest {
  string partner_id = 1;
  Revision through_cursor = 2;
}

message MarkPartnerReadResponse {
  PartnerActivity activity = 1;
}

message ListPartnerPrivateThreadsRequest {
  string partner_id = 1;
}

message ListPartnerPrivateThreadsResponse {
  repeated PartnerPrivateThread threads = 1;
}

message GetPartnerPrivateThreadRequest {
  string partner_id = 1;
  string thread_id = 2;
}

message GetPartnerPrivateThreadResponse {
  PartnerPrivateThread thread = 1;
  repeated PartnerPrivateMessage messages = 2;
  optional PartnerPrivateThreadReadState read_state = 3;
}

message MarkPartnerPrivateThreadReadRequest {
  string partner_id = 1;
  string thread_id = 2;
  uint64 through_sequence = 3;
}

message MarkPartnerPrivateThreadReadResponse {
  PartnerPrivateThreadReadState read_state = 1;
}

message ListPartnerDelegationsRequest {
  string partner_id = 1;
}

message ListPartnerDelegationsResponse {
  repeated PartnerDelegation delegations = 1;
}

message GetPartnerDelegationRequest {
  string partner_id = 1;
  string delegation_id = 2;
}

message GetPartnerDelegationResponse {
  PartnerDelegation delegation = 1;
}

message CancelPartnerDelegationRequest {
  string partner_id = 1;
  string delegation_id = 2;
  Revision expected_revision = 3;
}

message CancelPartnerDelegationResponse {
  PartnerDelegation delegation = 1;
}
