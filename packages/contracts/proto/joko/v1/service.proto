syntax = "proto3";

package joko.v1;

import "google/protobuf/timestamp.proto";
import "joko/v1/capability.proto";
import "joko/v1/common.proto";
import "joko/v1/event.proto";
import "joko/v1/interaction.proto";
import "joko/v1/managed_model_runtime.proto";
import "joko/v1/model.proto";
import "joko/v1/operation.proto";
import "joko/v1/pi.proto";
import "joko/v1/portable_session.proto";
import "joko/v1/runtime.proto";
import "joko/v1/review.proto";
import "joko/v1/settings.proto";
import "joko/v1/snapshot.proto";
import "joko/v1/subagent.proto";
import "joko/v1/tool.proto";
import "joko/v1/voice.proto";
import "joko/v1/workspace.proto";

service ConnectionService {
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
  // Public, credential-free bootstrap metadata used by the connection screen.
  rpc ListDiscoveredNodes(ListDiscoveredNodesRequest) returns (ListDiscoveredNodesResponse);
  rpc BeginPairing(BeginPairingRequest) returns (BeginPairingResponse);
  rpc CompletePairing(CompletePairingRequest) returns (CompletePairingResponse);
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse);
  rpc ListDeviceControlRelations(ListDeviceControlRelationsRequest) returns (ListDeviceControlRelationsResponse);
}

service EventService {
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  // Re-sampled at the destructive-action boundary; callers must fail closed
  // when this probe is unavailable rather than infer activity from UI caches.
  rpc GetRuntimeActivity(GetRuntimeActivityRequest) returns (GetRuntimeActivityResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse);
}

service OperationService {
  rpc SubmitOperation(SubmitOperationRequest) returns (SubmitOperationResponse);
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  rpc WatchOperation(WatchOperationRequest) returns (stream WatchOperationResponse);
}

service BackendService {
  rpc ListBackends(ListBackendsRequest) returns (ListBackendsResponse);
  rpc GetBackend(GetBackendRequest) returns (GetBackendResponse);
  rpc ListRuntimeProcesses(ListRuntimeProcessesRequest) returns (ListRuntimeProcessesResponse);
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc GetProvider(GetProviderRequest) returns (GetProviderResponse);
  rpc GetProviderUsage(GetProviderUsageRequest) returns (GetProviderUsageResponse);
  rpc GetUsageHistory(GetUsageHistoryRequest) returns (GetUsageHistoryResponse);
  rpc GetModelPriceOverride(GetModelPriceOverrideRequest) returns (GetModelPriceOverrideResponse);
  rpc SetModelPriceOverride(SetModelPriceOverrideRequest) returns (SetModelPriceOverrideResponse);
  rpc ResetModelPriceOverride(ResetModelPriceOverrideRequest) returns (ResetModelPriceOverrideResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc GetProviderLoginFlow(GetProviderLoginFlowRequest) returns (GetProviderLoginFlowResponse);
}

service TargetService {
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse);
  rpc GetTarget(GetTargetRequest) returns (GetTargetResponse);
}

service SessionService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc DiscoverNativeSessions(DiscoverNativeSessionsRequest) returns (DiscoverNativeSessionsResponse);
  rpc ScanNativeSessionCatalog(ScanNativeSessionCatalogRequest) returns (ScanNativeSessionCatalogResponse);
  rpc GetNativeSessionTree(GetNativeSessionTreeRequest) returns (GetNativeSessionTreeResponse);
  rpc GetSessionStatistics(GetSessionStatisticsRequest) returns (GetSessionStatisticsResponse);
  rpc ListRuntimeCommands(ListRuntimeCommandsRequest) returns (ListRuntimeCommandsResponse);
  rpc ListBackgroundTasks(ListBackgroundTasksRequest) returns (ListBackgroundTasksResponse);
  rpc ListSessionTimeline(ListSessionTimelineRequest) returns (ListSessionTimelineResponse);
  rpc SearchSessionMessages(SearchSessionMessagesRequest) returns (SearchSessionMessagesResponse);
  // Ephemeral one-shot prediction. It never appends to Backend/native history.
  rpc PredictNextPrompt(PredictNextPromptRequest) returns (PredictNextPromptResponse);
  // Ephemeral one-shot title generation. Conversation material never crosses
  // the renderer boundary and the generated title is not committed here.
  rpc SuggestSessionTitle(SuggestSessionTitleRequest) returns (SuggestSessionTitleResponse);
}

// Authenticated portable task transfer. Passwords cross only the transient
// RPC methods; the commit refers to a connection-bound, ten-minute draft.
service PortableSessionService {
  rpc ExportPortableSession(ExportPortableSessionRequest) returns (ExportPortableSessionResponse);
  rpc InspectPortableSessionImport(InspectPortableSessionImportRequest) returns (InspectPortableSessionImportResponse);
  rpc UnlockPortableSessionImport(UnlockPortableSessionImportRequest) returns (UnlockPortableSessionImportResponse);
  rpc CancelPortableSessionImport(CancelPortableSessionImportRequest) returns (CancelPortableSessionImportResponse);
  rpc CommitPortableSessionImport(CommitPortableSessionImportRequest) returns (CommitPortableSessionImportResponse);
  rpc RetryPortableSessionActivation(RetryPortableSessionActivationRequest) returns (RetryPortableSessionActivationResponse);
}

service RunService {
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
}

service QueueService {
  rpc ListQueueItems(ListQueueItemsRequest) returns (ListQueueItemsResponse);
  rpc GetQueueControl(GetQueueControlRequest) returns (GetQueueControlResponse);
}

service SchedulerService {
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse);
  rpc ListScheduleRunHistory(ListScheduleRunHistoryRequest) returns (ListScheduleRunHistoryResponse);
  rpc GetSchedulerRuntime(GetSchedulerRuntimeRequest) returns (GetSchedulerRuntimeResponse);
}

service InteractionService {
  rpc ListInteractions(ListInteractionsRequest) returns (ListInteractionsResponse);
  rpc GetInteraction(GetInteractionRequest) returns (GetInteractionResponse);
}

service WorkspaceService {
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc WatchWorkspaceFileChanges(WatchWorkspaceFileChangesRequest) returns (stream WatchWorkspaceFileChangesResponse);
  rpc ListWorkspaceEntries(ListWorkspaceEntriesRequest) returns (ListWorkspaceEntriesResponse);
  // Lazy filename index (`rg --files --hidden`, 30k cap).
  rpc ListWorkspaceFiles(ListWorkspaceFilesRequest) returns (ListWorkspaceFilesResponse);
  rpc ReadWorkspaceFile(ReadWorkspaceFileRequest) returns (ReadWorkspaceFileResponse);
  rpc WriteWorkspaceTextFile(WriteWorkspaceTextFileRequest) returns (WriteWorkspaceTextFileResponse);
  rpc SearchWorkspace(SearchWorkspaceRequest) returns (SearchWorkspaceResponse);
  // Fixed-string project search. Match records arrive while
  // ripgrep is running; cancelling the RPC terminates that owned process.
  rpc StreamWorkspaceSearch(StreamWorkspaceSearchRequest) returns (stream StreamWorkspaceSearchResponse);
  rpc GetGitStatus(GetGitStatusRequest) returns (GetGitStatusResponse);
  rpc GetWorkspaceDiff(GetWorkspaceDiffRequest) returns (GetWorkspaceDiffResponse);
  rpc ReadWorkspaceDiffFile(ReadWorkspaceDiffFileRequest) returns (ReadWorkspaceDiffFileResponse);
  rpc ReadWorkspaceDiffImage(ReadWorkspaceDiffImageRequest) returns (ReadWorkspaceDiffImageResponse);
  rpc ListWorkspaceChangeSets(ListWorkspaceChangeSetsRequest) returns (ListWorkspaceChangeSetsResponse);
  rpc PreviewWorkspaceRewind(PreviewWorkspaceRewindRequest) returns (PreviewWorkspaceRewindResponse);
}

service ArtifactService {
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  rpc BeginBlobUpload(BeginBlobUploadRequest) returns (BeginBlobUploadResponse);
  rpc CompleteBlobUpload(CompleteBlobUploadRequest) returns (CompleteBlobUploadResponse);
  rpc GetBlobDownloadTicket(GetBlobDownloadTicketRequest) returns (GetBlobDownloadTicketResponse);
  rpc GetArtifactStorageStats(GetArtifactStorageStatsRequest) returns (GetArtifactStorageStatsResponse);
  rpc ScanArtifactStorage(ScanArtifactStorageRequest) returns (ScanArtifactStorageResponse);
  rpc ReconcileArtifactStorage(ReconcileArtifactStorageRequest) returns (ReconcileArtifactStorageResponse);
  rpc CleanupArtifactStorage(CleanupArtifactStorageRequest) returns (CleanupArtifactStorageResponse);
}

service HistoryMaintenanceService {
  rpc GetHistoryMaintenanceSupport(GetHistoryMaintenanceSupportRequest) returns (GetHistoryMaintenanceSupportResponse);
  rpc ScanTaskHistory(ScanTaskHistoryRequest) returns (ScanTaskHistoryResponse);
  rpc BeginTaskHistoryCleanup(BeginTaskHistoryCleanupRequest) returns (BeginTaskHistoryCleanupResponse);
  rpc GetTaskHistoryCleanup(GetTaskHistoryCleanupRequest) returns (GetTaskHistoryCleanupResponse);
  rpc CancelTaskHistoryCleanup(CancelTaskHistoryCleanupRequest) returns (CancelTaskHistoryCleanupResponse);
}

service CredentialService {
  rpc BeginCredentialUpload(BeginCredentialUploadRequest) returns (BeginCredentialUploadResponse);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc BeginProviderLoginInputUpload(BeginProviderLoginInputUploadRequest) returns (BeginProviderLoginInputUploadResponse);
  rpc SubmitProviderLoginInput(SubmitProviderLoginInputRequest) returns (SubmitProviderLoginInputResponse);
  rpc CancelProviderLogin(CancelProviderLoginRequest) returns (CancelProviderLoginResponse);
}

service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
}

// Orchestrator-node-owned local inference runtimes. Shared clients discover every
// action through ManagedModelRuntimeCapabilities and never infer behavior from
// a concrete runtime_id.
service ManagedModelRuntimeService {
  rpc ListManagedModelRuntimes(ListManagedModelRuntimesRequest) returns (ListManagedModelRuntimesResponse);
  rpc GetManagedModelRuntime(GetManagedModelRuntimeRequest) returns (GetManagedModelRuntimeResponse);
  rpc StartManagedModelRuntime(StartManagedModelRuntimeRequest) returns (StartManagedModelRuntimeResponse);
  rpc InstallManagedModelRuntime(InstallManagedModelRuntimeRequest) returns (InstallManagedModelRuntimeResponse);
  rpc CancelManagedModelRuntimeInstall(CancelManagedModelRuntimeInstallRequest) returns (CancelManagedModelRuntimeInstallResponse);
  rpc PullManagedModel(PullManagedModelRequest) returns (PullManagedModelResponse);
  rpc PauseManagedModelPull(PauseManagedModelPullRequest) returns (PauseManagedModelPullResponse);
  rpc ResumeManagedModelPull(ResumeManagedModelPullRequest) returns (ResumeManagedModelPullResponse);
  rpc CancelManagedModelPull(CancelManagedModelPullRequest) returns (CancelManagedModelPullResponse);
  rpc DeleteManagedModel(DeleteManagedModelRequest) returns (DeleteManagedModelResponse);
  rpc GetManagedModelPreflight(GetManagedModelPreflightRequest) returns (GetManagedModelPreflightResponse);
}

service ToolService {
  rpc ListToolProviders(ListToolProvidersRequest) returns (ListToolProvidersResponse);
  rpc GetToolProvider(GetToolProviderRequest) returns (GetToolProviderResponse);
  rpc GetRuntimeToolCatalog(GetRuntimeToolCatalogRequest) returns (GetRuntimeToolCatalogResponse);
  rpc GetToolCall(GetToolCallRequest) returns (GetToolCallResponse);
  rpc ListToolCalls(ListToolCallsRequest) returns (ListToolCallsResponse);
  rpc ListToolLeases(ListToolLeasesRequest) returns (ListToolLeasesResponse);
  rpc ListMcpServers(ListMcpServersRequest) returns (ListMcpServersResponse);
}

service BrowserService {
  rpc ListBrowserProviders(ListBrowserProvidersRequest) returns (ListBrowserProvidersResponse);
  rpc GetBrowserProvider(GetBrowserProviderRequest) returns (GetBrowserProviderResponse);
  rpc ListBrowserPages(ListBrowserPagesRequest) returns (ListBrowserPagesResponse);
  rpc GetBrowserPage(GetBrowserPageRequest) returns (GetBrowserPageResponse);
  rpc ListBrowserActivity(ListBrowserActivityRequest) returns (ListBrowserActivityResponse);
  rpc ListBrowserTransfers(ListBrowserTransfersRequest) returns (ListBrowserTransfersResponse);
  // Service-device authentication is mandatory for both remote automation
  // methods. Public LAN discovery grants no execution authority.
  rpc ListBrowserAutomationNodes(ListBrowserAutomationNodesRequest) returns (ListBrowserAutomationNodesResponse);
  rpc ExecuteBrowserAutomationAction(ExecuteBrowserAutomationActionRequest) returns (ExecuteBrowserAutomationActionResponse);
  // Authenticated, ephemeral page-annotation control. Page evidence and live
  // design previews never enter Event, Operation, Snapshot, or log surfaces.
  rpc InspectBrowserCommentTarget(InspectBrowserCommentTargetRequest) returns (InspectBrowserCommentTargetResponse);
  rpc UpdateBrowserCommentDesign(UpdateBrowserCommentDesignRequest) returns (UpdateBrowserCommentDesignResponse);
}

service WorktreeService {
  rpc ProbeTargetWorktree(ProbeTargetWorktreeRequest) returns (ProbeTargetWorktreeResponse);
  rpc ListTargetWorktreeSources(ListTargetWorktreeSourcesRequest) returns (ListTargetWorktreeSourcesResponse);
}

service SubagentService {
  rpc ListSubagentRuns(ListSubagentRunsRequest) returns (ListSubagentRunsResponse);
  rpc GetSubagentRun(GetSubagentRunRequest) returns (GetSubagentRunResponse);
  rpc ListSubagentTranscript(ListSubagentTranscriptRequest) returns (ListSubagentTranscriptResponse);
}

// Authenticated, ephemeral speech-to-text control. Audio and text-bearing
// responses never enter the durable Event/Snapshot surfaces.
service VoiceInputService {
  rpc GetVoiceInputCapabilities(GetVoiceInputCapabilitiesRequest) returns (GetVoiceInputCapabilitiesResponse);
  rpc TestVoiceInputConnection(TestVoiceInputConnectionRequest) returns (TestVoiceInputConnectionResponse);
  rpc AdviseVoiceInputDictionaryEdit(AdviseVoiceInputDictionaryEditRequest) returns (AdviseVoiceInputDictionaryEditResponse);
  rpc StartVoiceInput(StartVoiceInputRequest) returns (StartVoiceInputResponse);
  rpc AppendVoiceAudio(AppendVoiceAudioRequest) returns (AppendVoiceAudioResponse);
  rpc StopVoiceInput(StopVoiceInputRequest) returns (StopVoiceInputResponse);
  rpc CancelVoiceInput(CancelVoiceInputRequest) returns (CancelVoiceInputResponse);
  rpc GetVoiceInputSession(GetVoiceInputSessionRequest) returns (GetVoiceInputSessionResponse);
}

// Pi-only reads for namespaced panels. Shared UI and reducers use the services
// above and must gate these calls on capabilities.
service PiService {
  rpc GetPiSessionState(GetPiSessionStateRequest) returns (GetPiSessionStateResponse);
  rpc GetPiSessionTree(GetPiSessionTreeRequest) returns (GetPiSessionTreeResponse);
  rpc ListPiMessages(ListPiMessagesRequest) returns (ListPiMessagesResponse);
  rpc ListPiEntries(ListPiEntriesRequest) returns (ListPiEntriesResponse);
  rpc ListPiForkCandidates(ListPiForkCandidatesRequest) returns (ListPiForkCandidatesResponse);
  rpc ListPiCommands(ListPiCommandsRequest) returns (ListPiCommandsResponse);
  rpc ListPiResources(ListPiResourcesRequest) returns (ListPiResourcesResponse);
}

service ReviewService {
  rpc ListReviewRuns(ListReviewRunsRequest) returns (ListReviewRunsResponse);
  rpc GetReviewRun(GetReviewRunRequest) returns (GetReviewRunResponse);
}

message GetServerInfoRequest {}

message GetVoiceInputCapabilitiesRequest {}

message GetVoiceInputCapabilitiesResponse {
  VoiceInputCapabilityProfile profile = 1;
}

message TestVoiceInputConnectionRequest {}

message TestVoiceInputConnectionResponse {
  bool ok = 1;
  VoiceInputConnectionTestFailure failure = 2;
}

// Text is processed only for this authenticated request and is never written
// to Operation, Event, Snapshot, Session, diagnostics, or logs.
message AdviseVoiceInputDictionaryEditRequest {
  string before_text = 1;
  string after_text = 2;
  optional string raw_transcript_text = 3;
  optional string locale = 4;
  repeated VoiceInputDictionaryEntryState existing_entries = 5;
  repeated VoiceInputDictionaryCandidateState existing_candidates = 6;
}

message AdviseVoiceInputDictionaryEditResponse {
  repeated VoiceInputDictionaryLearningAction actions = 1;
}

enum VoiceInputConnectionTestFailure {
  VOICE_INPUT_CONNECTION_TEST_FAILURE_UNSPECIFIED = 0;
  VOICE_INPUT_CONNECTION_TEST_FAILURE_CREDENTIALS_MISSING = 1;
  VOICE_INPUT_CONNECTION_TEST_FAILURE_AUTHENTICATION_FAILED = 2;
  VOICE_INPUT_CONNECTION_TEST_FAILURE_ROUTE_UNAVAILABLE = 3;
  VOICE_INPUT_CONNECTION_TEST_FAILURE_TIMEOUT = 4;
  VOICE_INPUT_CONNECTION_TEST_FAILURE_NETWORK = 5;
  VOICE_INPUT_CONNECTION_TEST_FAILURE_SERVICE_ERROR = 6;
}

message StartVoiceInputRequest {
  // Caller-generated idempotency key scoped to the authenticated Connection.
  string request_id = 1;
  string mime_type = 2;
  optional string locale = 3;
  // Ephemeral cleanup preferences. These fields are bounded at the service
  // edge and never enter Operation, Event, Snapshot, Session, or log storage.
  optional string refinement_instructions = 4;
  repeated string dictionary_terms = 5;
}

message StartVoiceInputResponse {
  VoiceInputSession session = 1;
}

message AppendVoiceAudioRequest {
  string voice_input_id = 1;
  // Strictly increasing, starts at one, and is accepted exactly once.
  uint64 chunk_sequence = 2;
  bytes audio = 3;
  uint32 duration_ms = 4;
  bool voiced = 5;
}

message AppendVoiceAudioResponse {
  VoiceInputSession session = 1;
}

message StopVoiceInputRequest {
  string voice_input_id = 1;
  // Fences Stop behind every acknowledged audio chunk.
  uint64 expected_next_chunk_sequence = 2;
}

message StopVoiceInputResponse {
  VoiceInputSession session = 1;
}

message CancelVoiceInputRequest {
  string voice_input_id = 1;
}

message CancelVoiceInputResponse {
  VoiceInputSession session = 1;
}

message GetVoiceInputSessionRequest {
  string voice_input_id = 1;
}

message GetVoiceInputSessionResponse {
  VoiceInputSession session = 1;
}

message GetServerInfoResponse {
  ServerInfo server = 1;
}

message ListDiscoveredNodesRequest {}

message ListDiscoveredNodesResponse {
  repeated DiscoveredNode nodes = 1;
}

message BeginPairingRequest {
  string device_display_name = 1;
  DeviceKind device_kind = 2;
  string platform = 3;
  string app_version = 4;
}

message BeginPairingResponse {
  PairingChallenge challenge = 1;
}

message CompletePairingRequest {
  string challenge_id = 1;
  string human_code = 2;
  string device_display_name = 3;
  DeviceKind device_kind = 4;
  string platform = 5;
  string app_version = 6;
  // Optional only for adding another Connection to an existing Device. Orchestrator
  // must honor it exclusively for an authenticated caller whose current
  // Connection already belongs to this same Device. Anonymous pairing omits
  // the field and always creates a new Device.
  optional string device_id = 7;
}

message CompletePairingResponse {
  PairingResult result = 1;
}

message ListConnectionsRequest {
  PageRequest page = 1;
  optional ConnectionState state = 2;
}

message ListConnectionsResponse {
  repeated Connection connections = 1;
  PageInfo page = 2;
}

message GetConnectionRequest {
  string connection_id = 1;
}

message GetConnectionResponse {
  Connection connection = 1;
}

message ListDevicesRequest {
  PageRequest page = 1;
  optional bool revoked = 2;
}

message ListDevicesResponse {
  repeated Device devices = 1;
  PageInfo page = 2;
}

message GetDeviceRequest {
  string device_id = 1;
}

message GetDeviceResponse {
  Device device = 1;
}

message ListDeviceControlRelationsRequest {
  PageRequest page = 1;
  // Empty lists all relations visible to the owner. A Device ID narrows the
  // result to relations where it is either controller or target.
  string device_id = 2;
}

message ListDeviceControlRelationsResponse {
  repeated DeviceControlRelation relations = 1;
  PageInfo page = 2;
}

message GetSnapshotRequest {
  SnapshotScope scope = 1;
}

message GetSnapshotResponse {
  Snapshot snapshot = 1;
}

message GetRuntimeActivityRequest {}

message GetRuntimeActivityResponse {
  RuntimeActivitySummary summary = 1;
}

message StreamEventsRequest {
  SnapshotScope scope = 1;
  EventCursor after_cursor = 2;
}

message StreamEventsResponse {
  Event event = 1;
}

message SubmitOperationRequest {
  // Generated by the client. Reuse is valid only with the identical mutation.
  string operation_id = 1;
  string connection_id = 2;
  OperationMutation mutation = 3;
}

message SubmitOperationResponse {
  Operation operation = 1;
}

message GetOperationRequest {
  string operation_id = 1;
}

message GetOperationResponse {
  Operation operation = 1;
}

message ListOperationsRequest {
  PageRequest page = 1;
  optional OperationState state = 2;
  string session_id = 3;
  string target_id = 4;
}

message ListOperationsResponse {
  repeated Operation operations = 1;
  PageInfo page = 2;
}

message WatchOperationRequest {
  string operation_id = 1;
  Revision after_revision = 2;
}

message WatchOperationResponse {
  Operation operation = 1;
}

message ListBackendsRequest {
  PageRequest page = 1;
}

message ListBackendsResponse {
  repeated BackendDescriptor backends = 1;
  PageInfo page = 2;
}

message GetBackendRequest {
  string backend_id = 1;
}

message GetBackendResponse {
  BackendDescriptor backend = 1;
}

message ListRuntimeProcessesRequest {
  string backend_id = 1;
}

message ListRuntimeProcessesResponse {
  repeated RuntimeProcessUsage processes = 1;
  google.protobuf.Timestamp captured_at = 2;
}

message ListProvidersRequest {
  string backend_id = 1;
  PageRequest page = 2;
}

message ListProvidersResponse {
  repeated ProviderDescriptor providers = 1;
  PageInfo page = 2;
}

message GetProviderRequest {
  string backend_id = 1;
  string provider_id = 2;
}

message GetProviderResponse {
  ProviderDescriptor provider = 1;
}

message GetProviderUsageRequest {
  string backend_id = 1;
  string provider_id = 2;
}

message GetProviderUsageResponse {
  ProviderUsageSummary usage = 1;
  RateLimitState rate_limit = 2;
  ProviderAccountUsageSnapshot account_usage = 3;
}

message ListModelsRequest {
  string backend_id = 1;
  string provider_id = 2;
  bool available_only = 3;
  PageRequest page = 4;
}

message ListModelsResponse {
  repeated ModelDescriptor models = 1;
  PageInfo page = 2;
}

message GetProviderLoginFlowRequest {
  string login_flow_id = 1;
}

message GetProviderLoginFlowResponse {
  ProviderLoginFlow login_flow = 1;
  AuthenticationState authentication_state = 2;
  ErrorInfo error = 3;
}

message ListTargetsRequest {
  string backend_id = 1;
  optional TargetState state = 2;
  string search_query = 3;
  PageRequest page = 4;
}

message ListTargetsResponse {
  repeated Target targets = 1;
  PageInfo page = 2;
}

message GetTargetRequest {
  string target_id = 1;
}

message GetTargetResponse {
  Target target = 1;
}

message ListSessionsRequest {
  string backend_id = 1;
  string target_id = 2;
  optional SessionState state = 3;
  optional bool archived = 4;
  string search_query = 5;
  PageRequest page = 6;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  PageInfo page = 2;
}

message GetUsageHistoryRequest {
  // Zero selects 140 days. Values above 366 are rejected.
  uint32 days = 1;
  string backend_id = 2;
  string provider_id = 3;
}

message GetUsageHistoryResponse {
  UsageHistory history = 1;
}

message GetModelPriceOverrideRequest {
  string backend_id = 1;
  string provider_id = 2;
  string model_id = 3;
}

message GetModelPriceOverrideResponse {
  ModelPriceOverrideView price = 1;
}

message SetModelPriceOverrideRequest {
  string backend_id = 1;
  string provider_id = 2;
  string model_id = 3;
  ModelPriceQuote desired = 4;
}

message SetModelPriceOverrideResponse {
  ModelPriceOverrideView price = 1;
}

message ResetModelPriceOverrideRequest {
  string backend_id = 1;
  string provider_id = 2;
  string model_id = 3;
}

message ResetModelPriceOverrideResponse {
  ModelPriceOverrideView price = 1;
}

message ListReviewRunsRequest {
  optional string source_session_id = 1;
  optional string reviewer_session_id = 2;
  optional ReviewRunState state = 3;
  PageRequest page = 4;
}

message ListReviewRunsResponse {
  repeated ReviewRun review_runs = 1;
  PageInfo page = 2;
}

message GetReviewRunRequest {
  string review_run_id = 1;
}

message GetReviewRunResponse {
  ReviewRun review_run = 1;
}

message DiscoverNativeSessionsRequest {
  string target_id = 1;
  PageRequest page = 2;
}

message DiscoverNativeSessionsResponse {
  repeated NativeSessionCandidate sessions = 1;
  PageInfo page = 2;
}

message ScanNativeSessionCatalogRequest {
  string backend_id = 1;
  bool force = 2;
}

message ScanNativeSessionCatalogResponse {
  repeated NativeSessionCatalogEntry entries = 1;
  uint64 rejected_count = 2;
  uint64 existing_count = 3;
  string snapshot_token = 4;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message GetNativeSessionTreeRequest {
  string session_id = 1;
}

message GetNativeSessionTreeResponse {
  NativeSessionTree tree = 1;
}

message GetSessionStatisticsRequest {
  string session_id = 1;
}

message GetSessionStatisticsResponse {
  SessionStatistics statistics = 1;
}

message ListBackgroundTasksRequest {
  string session_id = 1;
  optional BackgroundTaskState state = 2;
  PageRequest page = 3;
}

message ListBackgroundTasksResponse {
  // One latest durable projection per task identity. Non-terminal tasks come
  // first by started_at/created_at ascending; terminal tasks follow by
  // ended_at/updated_at/created_at descending. Task ID is the final tie-break.
  repeated BackgroundTask background_tasks = 1;
  PageInfo page = 2;
}

message ListSubagentRunsRequest {
  string session_id = 1;
  optional SubagentRunState state = 2;
  PageRequest page = 3;
}

message ListSubagentRunsResponse {
  repeated SubagentRun runs = 1;
  PageInfo page = 2;
}

message GetSubagentRunRequest {
  string session_id = 1;
  string subagent_run_id = 2;
}

message GetSubagentRunResponse {
  SubagentRunDetail run = 1;
}

message ListSubagentTranscriptRequest {
  string session_id = 1;
  string subagent_run_id = 2;
  string child_id = 3;
  PageRequest page = 4;
}

message ListSubagentTranscriptResponse {
  repeated SubagentTranscriptEntry entries = 1;
  PageInfo page = 2;
  // May be supplied again as page.page_token to fetch entries appended later.
  string tail_page_token = 3;
}

message ListSessionTimelineRequest {
  string session_id = 1;
  EventCursor before_cursor = 2;
  uint32 limit = 3;
  // Returns a bounded ordered window centered as closely as possible on this
  // durable Event ID. This is mutually exclusive with before_cursor.
  string around_event_id = 4;
}

message ListSessionTimelineResponse {
  repeated Event events = 1;
  EventCursor next_before_cursor = 2;
}

message SearchSessionMessagesRequest {
  oneof scope {
    string session_id = 1;
    string target_id = 2;
    OwnerSessionMessageSearchScope owner = 5;
  }
  string query = 3;
  PageRequest page = 4;
  // Unspecified preserves the default hybrid behavior. Keyword is an
  // explicit, per-request opt-out and never disables the durable index.
  SessionMessageSearchSemanticMode semantic_mode = 6;
  SessionMessageSearchFilters filters = 7;
}

message OwnerSessionMessageSearchScope {}

enum SessionMessageSearchSessionStatus {
  SESSION_MESSAGE_SEARCH_SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_MESSAGE_SEARCH_SESSION_STATUS_ACTIVE = 1;
  SESSION_MESSAGE_SEARCH_SESSION_STATUS_ARCHIVED = 2;
}

// Presence distinguishes "any" from an explicitly empty set: absent means
// any; present with no values means no Session can match.
message SessionMessageSearchIdSet {
  repeated string values = 1;
}

// Capability-neutral structured predicates shared by the FTS and vector
// arms. Unspecified scalar fields mean "any".
message SessionMessageSearchFilters {
  SessionMessageSearchIdSet target_ids = 1;
  SessionMessageSearchIdSet session_ids = 2;
  SessionMessageSearchIdSet backend_ids = 3;
  SessionMessageSearchSessionStatus session_status = 4;
  google.protobuf.Timestamp session_activity_from = 5;
