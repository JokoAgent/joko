name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        default: full
        options:
          - full
          - windows-native

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ inputs.scope == 'windows-native' && '-windows-native' || '' }}
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ matrix.os }} / Node 24.16${{ inputs.scope == 'windows-native' && ' / native regressions' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.scope == 'windows-native' && '["windows-latest"]' || '["ubuntu-24.04","windows-latest","macos-15"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm 11.22.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Use the canonical temporary directory
        id: temporary
        run: |
          node -e "const fs=require('node:fs'); const os=require('node:os'); const path=require('node:path'); const canonical=fs.realpathSync.native(os.tmpdir()); fs.mkdirSync(path.join(process.env.RUNNER_TEMP,'joko-ci-logs'),{recursive:true}); fs.appendFileSync(process.env.GITHUB_ENV, ['TMPDIR='+canonical, 'TMP='+canonical, 'TEMP='+canonical, ''].join('\n')); fs.appendFileSync(process.env.GITHUB_OUTPUT,'directory='+canonical+'\n');"

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential pkg-config libxcb1-dev libxcb-res0-dev libxcb-xkb-dev libwayland-dev libwayland-bin libxkbcommon-dev libjson-c-dev libturbojpeg0-dev libpng-dev ripgrep xauth xvfb

      - name: Install Windows test dependencies
        if: runner.os == 'Windows'
        run: choco install ripgrep --no-progress --yes

      - name: Install macOS test dependencies
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install dependencies from lockfile
        id: dependencies
        shell: bash
        run: pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/install.log"

      - name: Diagnose the reproducible macOS LAN discovery failure
        id: lan_discovery
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 2
        shell: bash
        run: pnpm --filter @joko/node-sync exec vitest run src/node-sync.test.ts -t "delivers on its granted purpose" 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/lan-discovery.log"

      - name: Upload the immediate LAN failure diagnosis
        if: ${{ !cancelled() && steps.lan_discovery.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-lan-discovery-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/joko-ci-logs/lan-discovery.log
          if-no-files-found: error
          retention-days: 3

      - name: Check build, boundaries, generated contracts, and types
        id: source_check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: pnpm check 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/check.log"
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload an immediately available source-check failure log
        if: ${{ !cancelled() && steps.source_check.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-source-check-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/joko-ci-logs/check.log
          if-no-files-found: error
          retention-days: 3

      - name: Diagnose the Windows SSH key permission failure
        id: ssh_key_permissions
        if: ${{ !cancelled() && steps.source_check.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 5
        shell: bash
        run: pnpm --filter @joko/remote-ssh exec vitest run src/keys.test.ts 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/ssh-key-permissions.log"

      - name: Upload the immediate SSH key permission failure diagnosis
        if: ${{ !cancelled() && steps.ssh_key_permissions.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-ssh-key-permissions-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/joko-ci-logs/ssh-key-permissions.log
          if-no-files-found: error
          retention-days: 3

      - name: Prepare Chromium for the production Web mounted chains
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 15
        shell: bash
        run: |
          pnpm --filter @joko/e2e exec playwright-core install --with-deps chromium 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/chromium.log"
          pnpm --filter @joko/e2e exec node -e "const fs=require('node:fs'); const path=require('node:path'); const browser=require('playwright-core').chromium.executablePath(); const web=path.join(process.env.GITHUB_WORKSPACE,'apps','web','dist'); fs.accessSync(browser,fs.constants.X_OK); fs.accessSync(path.join(web,'index.html')); fs.appendFileSync(process.env.GITHUB_ENV,['JOKO_BROWSER_EXECUTABLE='+fs.realpathSync(browser),'JOKO_MOUNTED_WEB_DIR='+fs.realpathSync(web),''].join('\n'));"

      - name: Run workspace test suite and headed Browser chains (Linux)
        id: workspace_tests_linux
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os == 'Linux' && inputs.scope != 'windows-native' }}
        shell: bash
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm test:ci 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/tests.log"
        env:
          XDG_SESSION_TYPE: x11
          WAYLAND_DISPLAY: ""

      - name: Run workspace test suite, including Connect end-to-end coverage (Windows/macOS)
        id: workspace_tests_desktop
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && runner.os != 'Linux' && inputs.scope != 'windows-native' }}
        shell: bash
        run: pnpm test:ci 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/tests.log"

      - name: Upload a failed workspace suite before runtime and packaging checks
        if: ${{ !cancelled() && (steps.workspace_tests_linux.outcome == 'failure' || steps.workspace_tests_desktop.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-workspace-tests-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/joko-ci-logs/tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Run the affected Windows Desktop checks
        if: ${{ !cancelled() && steps.source_check.outcome == 'success' && inputs.scope == 'windows-native' }}
        timeout-minutes: 5
        shell: bash
        run: pnpm --filter @joko/desktop exec vitest run test/managed-orchestrator-real.test.ts test/runtime-staging.test.ts test/remote-desktop-native-build.test.ts 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/desktop-native-regressions.log"

      - name: Run the affected Windows queue checks
        if: ${{ !cancelled() && steps.source_check.outcome == 'success' && inputs.scope == 'windows-native' }}
        timeout-minutes: 2
        shell: bash
        run: pnpm --filter @joko/store exec vitest run src/operational-store.test.ts -t queue 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/store-queue-regressions.log"

      - name: Check the Windows document worker regression
        if: ${{ !cancelled() && steps.source_check.outcome == 'success' && inputs.scope == 'windows-native' }}
        timeout-minutes: 2
        shell: bash
        run: pnpm --filter @joko/tool-document test 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/document-regressions.log"

      - name: Amplify the short queue soak and fault matrix
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && inputs.scope != 'windows-native' }}
        shell: bash
        run: pnpm test:soak 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/soak.log"
        env:
          JOKO_E2E_SOAK_ITERATIONS: "2"
          JOKO_E2E_SOAK_DURATION_MS: "3000"
          JOKO_E2E_FAULTS: clean,crash,dispatch_unknown,hang

      - name: Build and verify isolated Desktop Orchestrator runtime
        id: desktop_runtime
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && inputs.scope != 'windows-native' }}
        timeout-minutes: 45
        shell: bash
        run: pnpm stage:desktop:orchestrator-runtime 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/desktop-runtime.log"

      - name: Package the current platform Desktop application
        id: desktop_package
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        run: pnpm --filter @joko/desktop package:dir 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/desktop-package.log"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Run the packaged Desktop smoke (Linux)
        if: ${{ !cancelled() && steps.desktop_package.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 10
        shell: bash
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm test:desktop:artifact 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/desktop-smoke.log"
        env:
          JOKO_DESKTOP_SMOKE_NO_SANDBOX: "1"
          JOKO_DESKTOP_SMOKE_KEEP_FAILED: "1"
          XDG_SESSION_TYPE: x11
          WAYLAND_DISPLAY: ""

      - name: Run the packaged Desktop smoke (Windows/macOS)
        if: ${{ !cancelled() && steps.desktop_package.outcome == 'success' && runner.os != 'Linux' }}
        timeout-minutes: 10
        shell: bash
        run: pnpm test:desktop:artifact 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/desktop-smoke.log"
        env:
          JOKO_DESKTOP_SMOKE_KEEP_FAILED: "1"

      - name: Run the independent Desktop viewer GUI chain (Linux)
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 5
        shell: bash
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" node apps/desktop/scripts/smoke-remote-desktop-viewer.mjs 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/desktop-viewer.log"
        env:
          JOKO_REMOTE_DESKTOP_VIEWER_EVIDENCE_DIR: ${{ runner.temp }}/joko-viewer-evidence
          XDG_SESSION_TYPE: x11
          WAYLAND_DISPLAY: ""

      - name: Run the independent Desktop viewer GUI chain (Windows/macOS)
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && runner.os != 'Linux' }}
        timeout-minutes: 5
        shell: bash
        run: node apps/desktop/scripts/smoke-remote-desktop-viewer.mjs 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/desktop-viewer.log"
        env:
          JOKO_REMOTE_DESKTOP_VIEWER_EVIDENCE_DIR: ${{ runner.temp }}/joko-viewer-evidence

      - name: Verify the viewer's unbound prewarm lifecycle (Linux)
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 5
        shell: bash
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" node apps/desktop/scripts/smoke-remote-desktop-viewer.mjs --scope viewer-lifecycle 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/desktop-viewer-lifecycle.log"
        env:
          JOKO_REMOTE_DESKTOP_VIEWER_EVIDENCE_DIR: ${{ runner.temp }}/joko-viewer-evidence
          XDG_SESSION_TYPE: x11
          WAYLAND_DISPLAY: ""

      - name: Verify the viewer's unbound prewarm lifecycle (Windows/macOS)
        if: ${{ !cancelled() && steps.desktop_runtime.outcome == 'success' && runner.os != 'Linux' }}
        timeout-minutes: 5
        shell: bash
        run: node apps/desktop/scripts/smoke-remote-desktop-viewer.mjs --scope viewer-lifecycle 2>&1 | tee "$RUNNER_TEMP/joko-ci-logs/desktop-viewer-lifecycle.log"
        env:
          JOKO_REMOTE_DESKTOP_VIEWER_EVIDENCE_DIR: ${{ runner.temp }}/joko-viewer-evidence

      - name: Archive the packaged application with its source identity
        id: desktop_archive
        if: ${{ !cancelled() && steps.desktop_package.outcome == 'success' }}
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p ci-artifacts
          archive="Joko-${RUNNER_OS}-${RUNNER_ARCH}-${GITHUB_SHA}.tar.gz"
          tar -czf "ci-artifacts/$archive" -C apps/desktop release
          node --input-type=module - "$archive" <<'NODE'
          import { createReadStream, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const archive = process.argv[2], hash = createHash('sha256');
          for await (const chunk of createReadStream(`ci-artifacts/${archive}`)) hash.update(chunk);
          writeFileSync('ci-artifacts/manifest.json', JSON.stringify({ sourceCommit: process.env.GITHUB_SHA,
            platform: process.env.RUNNER_OS, architecture: process.env.RUNNER_ARCH, archive,
            sha256: hash.digest('hex') }, null, 2) + '\n');
          NODE

      - name: Upload the current platform application
        if: ${{ !cancelled() && steps.desktop_archive.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Collect bounded smoke receipts beside validation logs
        if: ${{ always() }}
        shell: bash
        run: node scripts/ci/collect-desktop-diagnostics.mjs

      - name: Upload validation logs and bounded smoke failure receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/joko-ci-logs/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload bounded Desktop viewer GUI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-viewer-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/joko-viewer-evidence/*.png
            ${{ runner.temp }}/joko-viewer-evidence/identity.json
            ${{ runner.temp }}/joko-viewer-evidence/result.json
            ${{ runner.temp }}/joko-viewer-evidence/failure.json
            ${{ runner.temp }}/joko-viewer-evidence/lifecycle/*.png
            ${{ runner.temp }}/joko-viewer-evidence/lifecycle/identity.json
            ${{ runner.temp }}/joko-viewer-evidence/lifecycle/result.json
            ${{ runner.temp }}/joko-viewer-evidence/lifecycle/failure.json
          if-no-files-found: warn
          retention-days: 3
