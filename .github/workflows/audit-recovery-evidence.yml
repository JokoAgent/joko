name: Audit recovery and discovery assertions
on:
  push:
    branches: [codex/audit-51648991-evidence]
permissions:
  contents: read
jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Prepare the two packages' test runtime
        shell: bash
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          npm install --prefix "$RUNNER_TEMP/audit-tools" --no-audit --no-fund vitest@4.1.9 typescript@5.9.3 minimatch@10.2.6 @types/node@24.12.4
          node -e "require('node:fs').symlinkSync(require('node:path').join(process.env.RUNNER_TEMP,'audit-tools','node_modules'),'node_modules',process.platform==='win32'?'junction':'dir')"
          node -e "const p=require('node:os').tmpdir(); console.log('process temp directory',p,'physical',require('node:fs').realpathSync.native(p))"
          node node_modules/typescript/bin/tsc -p packages/worktree/tsconfig.build.json
      - name: Observe Git's filename decisions
        shell: bash
        run: |
          git init -q "$RUNNER_TEMP/ignore-reference"
          cd "$RUNNER_TEMP/ignore-reference"
          printf '%s\n' 'generated**.ts' 'case[[:digit:]].ts' > .gitignore
          git -c core.quotepath=false check-ignore -v -n -- generated-file.ts generated-tools/visible.ts case1.ts caseA.ts case１.ts
      - name: Observe competing lock holders and their original error stacks
        shell: bash
        run: |
          node --enable-source-maps --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdtemp, realpath, rmdir } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { setTimeout } from 'node:timers/promises';
          import { withWorktreeSourceLock } from './packages/worktree/dist/source-use.js';
          const root = await realpath(await mkdtemp(join(tmpdir(), 'joko-lock-handoff-')));
          let active = 0, completed = 0;
          try {
            for (let round = 0; round < 48; round++) {
              const results = await Promise.allSettled(Array.from({ length: 8 }, () =>
                withWorktreeSourceLock(root, async () => {
                  active++;
                  try {
                    assert.equal(active, 1);
                    await setTimeout(5);
                    assert.equal(active, 1);
                    completed++;
                  } finally { active--; }
                })));
              for (const result of results) {
                if (result.status === 'rejected') {
                  console.error('round', round, 'completed', completed, result.reason?.stack);
                  throw result.reason;
                }
              }
            }
            assert.equal(completed, 384);
            console.log('Exclusive lock callbacks completed:', completed);
          } finally { await rmdir(root); }
          NODE
      - name: Interrupted cleanup and workspace symbol filtering
        shell: bash
        run: |
          node node_modules/vitest/vitest.mjs run --reporter=verbose packages/worktree/src/service.test.ts packages/tool-lsp/src/safety.test.ts -t 'while checkout cleanup was interrupted|post-reset crash boundary|Git wildcard components|temporary directory is an alias'
      - name: Exercise the complete worktree and LSP package suites
        shell: bash
        run: node node_modules/vitest/vitest.mjs run --reporter=verbose packages/worktree/src packages/tool-lsp/src
